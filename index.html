<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  apiKey: "AIzaSyCz0t_IjyIkhj-HoluGMmMC4SWIY-aZgjc",
  authDomain: "planning-equipe-fcede.firebaseapp.com",
  projectId: "planning-equipe-fcede",

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f6f8;font-family:'Segoe UI',Arial,sans-serif;}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

// ---------- CONST ----------
const DEFAULT_EMP = [
  {id:"e1",name:"Laetitia"},
  {id:"e2",name:"Nicolas"},
  {id:"e3",name:"Charlotte"}
];

const USERS = [
  {user:"Laetitia",pass:"Boutique2014!",role:"admin"},
  {user:"Nicolas",pass:"12345",role:"lecteur"}
];

// ---------- LOGIN ----------
function Login({onLogin}) {
  const [u,setU]=React.useState('');
  const [p,setP]=React.useState('');
  const [err,setErr]=React.useState('');

  const go = () => {
    const f = USERS.find(x=>x.user===u && x.pass===p);
    if(f) onLogin(f);
    else setErr("Identifiants incorrects");
  };

  return (
    <div style={{display:'flex',height:'100vh',alignItems:'center',justifyContent:'center'}}>
      <div>
        <h2>Connexion</h2>
        <input placeholder="user" onChange={e=>setU(e.target.value)}/>
        <input placeholder="pass" type="password" onChange={e=>setP(e.target.value)}/>
        <button onClick={go}>Login</button>
        <div>{err}</div>
      </div>
    </div>
  );
}

// ---------- APP ----------
function App(){

  const [session,setSession]=React.useState(null);
  const [employees,setEmployees]=React.useState(DEFAULT_EMP);
  const [view,setView]=React.useState("planning");

  if(!session) return <Login onLogin={setSession}/>;

  return (
    <div>
      <h1>Planning</h1>

      <button onClick={()=>setView("planning")}>Planning</button>
      <button onClick={()=>setView("recap")}>Recap</button>

      {view==="planning" && <Planning employees={employees}/>}
      {view==="recap" && <Recap employees={employees}/>}
    </div>
  );
}

// ---------- PLANNING ----------
function Planning({employees}){
  return (
    <div>
      <h2>Planning semaine</h2>
      {employees.map(e=>(
        <div key={e.id}>{e.name}</div>
      ))}
    </div>
  );
}

// ---------- RECAP (FIX ICI) ----------
function Recap({employees}){

  return (
    <div>
      <h2>Récap mensuel</h2>

      {employees.map(emp => (
        <div key={emp.id} style={{border:'1px solid #ccc',margin:10,padding:10}}>
          <h3>{emp.name}</h3>

          <table>
            <thead>
              <tr>
                <th>Semaine</th>
                <th>Heures</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>S1</td>
                <td>35h</td>
              </tr>
            </tbody>
          </table>

        </div>   // ✅ CORRECTION : plus de div en trop ici
      ))}

    </div>
  );
}

// ---------- RENDER ----------
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
