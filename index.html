const SLOTS = [];
for(let h=10;h<=19;h++){const mx=h===19?30:45;for(let m=0;m<=mx;m+=15)SLOTS.push(String(h).padStart(2,'0')+'h'+(m===0?'00':String(m)));}

const pad = n => String(n).padStart(2,'0');
const dk  = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const isWE = d => d.getDay()===0;
const addD = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
const getMon = d => { const r=new Date(d); const day=r.getDay(); r.setDate(r.getDate()+(day===0?-6:1-day)); r.setHours(0,0,0,0); return r; };
const frD  = d => d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
const frDC = d => d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const frDS = s => new Date(s+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
const frM  = (y,m) => new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const getWD = mon => Array.from({length:7},(_,i)=>addD(mon,i));

const parseH = (val, jourNum) => {
  if(!val) return 0;
  const up = val.trim().toUpperCase();
  const isAbs = ["OFF","CONGE","CONGÉ","RTT","MALADIE","ABSENCE","OFF/FERIE","OFF/FÉRIÉ"].some(x => up===x || up.startsWith(x+' '));
  const isFT = up.includes("FERIE TRAVAILLE") || up.includes("FERIE TRAVAILLÉ") || up.includes("FÉRIÉ TRAVAILLÉ");
  if(isAbs && !isFT) return 0;
  const m = val.match(/(\d{1,2})[hH](\d{2})\s*[\/\-]\s*(\d{1,2})[hH](\d{2})/i);
  if(!m) return 0;
  const a = parseInt(m[1])*60+parseInt(m[2]);
  const b = parseInt(m[3])*60+parseInt(m[4]);
  const diff = b-a;
  if(diff<=0) return 0;
  const isCh = up.includes("CHATEAU") || up.includes("CHÂTEAU");
  const isSam = jourNum===6;
  let pause = 0;
  if(diff>360){ pause = isCh ? (isSam?60:90) : 60; }
  return Math.round((diff-pause)/60*10)/10;
};

const cellBg = (val, ei) => {
  if(!val) return '#fff';
  const up = val.trim().toUpperCase();
  if(up==="OFF") return '#f8f8f8';
  if(up.includes("FERIE TRAVAIL")) return '#fff0e0';
  if(up.includes("FERIE")||up.includes("FÉRIÉ")) return '#fff8e1';
  if(up.includes("CONGE")||up.includes("CONGÉ")) return '#e8f8f0';
  if(up==="RTT") return '#e8f0ff';
  if(up==="MALADIE") return '#fde8e8';
  if(up.includes("T-C")) return '#ede8ff';
  if(up.includes("TOURS")) return '#e8f8ee';
  if(up.includes("CHATEAU")||up.includes("CHÂTEAU")) return '#fff8e1';
  if(up.includes("FORMATION")||up.includes("REUNION")) return '#e8f8f0';
  return eBg(ei);
};

const cellTxt = val => {
  if(!val) return '#ccc';
  const up = val.trim().toUpperCase();
  if(up==="OFF") return '#aaa';
  if(up.includes("FERIE TRAVAIL")) return '#c2410c';
  if(up.includes("FERIE")||up.includes("FÉRIÉ")) return '#b45309';
  if(up.includes("CONGE")||up.includes("CONGÉ")) return '#065f46';
  if(up==="RTT") return '#1e40af';
  if(up==="MALADIE") return '#991b1b';
  if(up.includes("T-C")) return '#4c1d95';
  if(up.includes("TOURS")) return '#14532d';
  if(up.includes("CHATEAU")||up.includes("CHÂTEAU")) return '#78350f';
  return '#1a1a2e';
};

const jouvres = (d1, d2) => {
  let d = new Date(d1), n = 0;
  while(d<=d2){ if(d.getDay()!==0) n++; d.setDate(d.getDate()+1); }
  return n;
};

const getMonthWeeks = (y,m) => {
  const weeks=[], last=new Date(y,m+1,0); let mon=getMon(new Date(y,m,1));
  while(mon<=last){
    const wd=getWD(mon).filter(d=>d.getMonth()===m&&!isWE(d));
    if(wd.length) weeks.push({mon:new Date(mon),wd});
    mon=addD(mon,7);
  }
  return weeks;
};

function Login({onLogin}) {
  const [u,setU] = React.useState('');
  const [p,setP] = React.useState('');
  const [err,setErr] = React.useState('');
  const [show,setShow] = React.useState(false);
  const go = () => {
    const f = USERS.find(x=>x.user.toLowerCase()===u.trim().toLowerCase()&&x.pass===p.trim());
    if(f){ saveS({user:f.user,role:f.role}); onLogin({user:f.user,role:f.role}); }
    else{ setErr('Identifiant ou mot de passe incorrect.'); setTimeout(()=>setErr(''),3000); }
  };
  return (
    <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#1a1a2e,#0f3460)',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'#fff',borderRadius:20,padding:40,width:360,maxWidth:'calc(100vw - 32px)',boxShadow:'0 30px 80px rgba(0,0,0,0.3)'}}>
        <div style={{textAlign:'center',marginBottom:28}}>
          <div style={{width:56,height:56,background:'linear-gradient(135deg,#1a6ed8,#8b1ad6)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,margin:'0 auto 12px'}}>
            <span>&#128197;</span>
          </div>
          <div style={{fontSize:20,fontWeight:800,color:'#1a1a2e'}}>Planning Equipe</div>
          <div style={{fontSize:12,color:'#aaa',marginTop:3}}>Connectez-vous pour continuer</div>
        </div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:5}}>Identifiant</div>
          <input value={u} onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()} placeholder="Votre prenom" autoFocus
            style={{width:'100%',border:'1.5px solid #e5e7eb',borderRadius:10,padding:'10px 13px',fontSize:14,color:'#1a1a2e',background:'#f8f9fa'}}/>
        </div>
        <div style={{marginBottom:18}}>
          <div style={{fontSize:11,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:5}}>Mot de passe</div>
          <div style={{position:'relative'}}>
            <input type={show?'text':'password'} value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()} placeholder="••••••••"
              style={{width:'100%',border:'1.5px solid #e5e7eb',borderRadius:10,padding:'10px 38px 10px 13px',fontSize:14,color:'#1a1a2e',background:'#f8f9fa'}}/>
            <button onClick={()=>setShow(x=>!x)} style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:15,color:'#aaa'}}>
              {show?'O':'*'}
            </button>
          </div>
        </div>
        {err&&<div style={{background:'#fde8e8',border:'1px solid #fca5a5',borderRadius:8,padding:'9px 13px',color:'#dc2626',fontSize:12,fontWeight:600,marginBottom:14,textAlign:'center'}}>{err}</div>}
        <button onClick={go} style={{width:'100%',padding:'12px 0',borderRadius:10,border:'none',background:'linear-gradient(135deg,#1a6ed8,#8b1ad6)',color:'#fff',fontWeight:800,fontSize:15,cursor:'pointer'}}>
          Se connecter
        </button>
        <div style={{textAlign:'center',marginTop:16,fontSize:11,color:'#ccc'}}>Acces securise - Planning Equipe</div>
      </div>
    </div>
  );
}

function App() {
  const today = new Date();
  const [session,  setSession]  = React.useState(null);
  const [sesOk,    setSesOk]    = React.useState(false);
  const [fbReady,  setFbReady]  = React.useState(false);
  const [sync,     setSync]     = React.useState('Connexion...');
  const [employees,setEmployees]= React.useState(DEFAULT_EMP);
  const [cells,    setCells]    = React.useState({});
  const [conges,   setConges]   = React.useState([]);
  const [view,     setView]     = React.useState('planning');
  const [monday,   setMonday]   = React.useState(getMon(today));
  const [cgMonth,  setCgMonth]  = React.useState(today.getMonth());
  const [cgYear,   setCgYear]   = React.useState(today.getFullYear());
  const [recapM,   setRecapM]   = React.useState(today.getMonth());
  const [recapY,   setRecapY]   = React.useState(today.getFullYear());
  const [modal,    setModal]    = React.useState(null);
  const [mLieu,    setMLieu]    = React.useState('');
  const [mAbs,     setMAbs]     = React.useState('');
  const [mDeb,     setMDeb]     = React.useState('');
  const [mFin,     setMFin]     = React.useState('');
  const [mHS,      setMHS]      = React.useState(0);
  const [mFerie,   setMFerie]   = React.useState(false);
  const [cgEmp,    setCgEmp]    = React.useState('');
  const [cgType,   setCgType]   = React.useState('Conge');
  const [cgDeb,    setCgDeb]    = React.useState('');
  const [cgFin,    setCgFin]    = React.useState('');
  const [cgNote,   setCgNote]   = React.useState('');
  const [selS,     setSelS]     = React.useState(null);
  const [selE,     setSelE]     = React.useState(null);
  const [hovD,     setHovD]     = React.useState(null);
  const [newName,  setNewName]  = React.useState('');
  const [isMobile, setIsMobile] = React.useState(window.innerWidth <= 640);

  React.useEffect(()=>{
    const h = () => setIsMobile(window.innerWidth <= 640);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);
  const isAdmin = session && session.role === 'admin';

  React.useEffect(()=>{ const s=loadS(); if(s)setSession(s); setSesOk(true); },[]);
  React.useEffect(()=>{
    if(window.__fbReady){setFbReady(true);return;}
    const h=()=>setFbReady(true);
    window.addEventListener('fbReady',h);
    return()=>window.removeEventListener('fbReady',h);
  },[]);
  React.useEffect(()=>{
    if(!fbReady||!session) return;
    const {db,onSnapshot,collection,doc}=window.__fb;
    const u1=onSnapshot(doc(db,'planning','cells'),snap=>{if(snap.exists())setCells(snap.data().data||{});setSync('Synchronise');},()=>setSync('Erreur sync'));
    const u2=onSnapshot(collection(db,'conges'),snap=>setConges(snap.docs.map(d=>({id:d.id,...d.data()}))));
    const u3=onSnapshot(doc(db,'planning','employees'),snap=>{if(snap.exists()&&snap.data().list&&snap.data().list.length>0)setEmployees(snap.data().list);});
    return()=>{u1();u2();u3();};
  },[fbReady,session]);

  const saveC = async nc => {
    if(!fbReady) return;
    const {db,doc,setDoc}=window.__fb;
    setSync('Sauvegarde...');
    try{await setDoc(doc(db,'planning','cells'),{data:nc});setSync('Synchronise');}catch(e){setSync('Erreur');}
  };
  const saveE = async list => {
    if(!fbReady) return;
    const {db,doc,setDoc}=window.__fb;
    try{await setDoc(doc(db,'planning','employees'),{list});}catch(e){}
  };
  const addCg = async () => {
    if(!cgEmp||!cgDeb||!cgFin||!fbReady) return;
    const {db,doc,setDoc}=window.__fb;
    const id='cg'+Date.now();
    await setDoc(doc(db,'conges',id),{empId:cgEmp,type:cgType,debut:cgDeb,fin:cgFin,note:cgNote});
    setCgDeb('');setCgFin('');setCgNote('');setSelS(null);setSelE(null);
  };
  const delCg = async id => {
    if(!fbReady) return;
    const {db,doc,deleteDoc}=window.__fb;
    try{await deleteDoc(doc(db,'conges',id));}catch(e){}
  };

  const getCellVal = (empId, dStr) => {
    const c = (cells[empId]||{})[dStr];
    if(c&&c.val) return c;
    const cg = conges.find(g=>dStr>=g.debut&&dStr<=g.fin&&g.empId===empId);
    if(cg) return {val:cg.type==='Conge'?'Conge':cg.type,hsupp:0,fromCg:true};
    return null;
  };

  const openModal = (empId, date, dayIdx) => {
    const k=dk(date), c=(cells[empId]||{})[k]||{}, val=c.val||'';
    const up=val.toUpperCase();
    const isFT = up.includes("FERIE TRAVAIL");
    setMFerie(isFT);
    if(isFT){ setMAbs(''); setMLieu(''); }
    else {
      const ai = ABSENCES.findIndex(a=>up.startsWith(a.toUpperCase()));
      setMAbs(ai>=0?ABSENCES[ai]:'');
      const li = LIEUX.findIndex(l=>up.startsWith(l.toUpperCase()));
      setMLieu(li>=0?LIEUX[li]:'');
    }
    const mt = val.match(/(\d{1,2})[hH](\d{2})\s*[\/\-]\s*(\d{1,2})[hH](\d{2})/i);
    setMDeb(mt?mt[1]+'h'+mt[2]:'');
    setMFin(mt?mt[3]+'h'+mt[4]:'');
    setMHS(c.hsupp||0);
    setModal({empId,date,k,dayIdx});
  };

  const saveModal = async () => {
    if(!modal) return;
    const {empId,k}=modal;
    let val='';
    if(mFerie&&mDeb&&mFin) val='Ferie travaille '+mDeb+'/'+mFin;
    else if(mAbs) val=mAbs;
    else if(mDeb&&mFin) val=mLieu?(mLieu+' '+mDeb+'/'+mFin):(mDeb+'/'+mFin);
    else if(mLieu) val=mLieu;
    const nc={...cells,[empId]:{...(cells[empId]||{})}};
    if(val||Number(mHS)>0) nc[empId][k]={val,hsupp:Number(mHS)||0};
    else delete nc[empId][k];
    setCells(nc); await saveC(nc); setModal(null);
  };

  const clearModal = async () => {
    if(!modal) return;
    const {empId,k}=modal;
    const nc={...cells,[empId]:{...(cells[empId]||{})}};
    delete nc[empId][k];
    setCells(nc); await saveC(nc);
    setMLieu('');setMAbs('');setMDeb('');setMFin('');setMHS(0);setMFerie(false);setModal(null);
  };

  const weekStats = (empId, wDays) => {
    let h=0,hs=0,hf=0;
    wDays.forEach(d=>{
      const cv=getCellVal(empId,dk(d));
      if(!cv) return;
      const up=(cv.val||'').toUpperCase();
      const heures=parseH(cv.val,d.getDay());
      if(up.includes("FERIE TRAVAIL")){ hf+=Math.round(heures*1.25*10)/10; }
      else{ h+=heures; if(cv.hsupp)hs+=Number(cv.hsupp); }
    });
    const tot=Math.round((h+hs+hf)*10)/10;
    return {h:Math.round(h*10)/10,hs,hf,tot,diff:Math.round((tot-H_SEM)*10)/10};
  };

  const monthStats = (empId, y, m) => {
    const d=new Date(y,m,1);
    let hT=0,hS=0,hFB=0,hFM=0,cpJ=0,rttJ=0,malJ=0,fJ=0,ftJ=0,jo=0;
    while(d.getMonth()===m){
      if(!isWE(d)) jo++;
      const k=dk(d), cv=getCellVal(empId,k);
      if(cv){
        const up=(cv.val||'').toUpperCase();
        const h=parseH(cv.val,d.getDay());
        if(up.includes("FERIE TRAVAIL")){
          ftJ++; hFB+=h; hFM+=Math.round(h*1.25*10)/10;
        } else {
          hT+=h; if(cv.hsupp)hS+=Number(cv.hsupp);
          if(up.includes("CONGE")||up.includes("CONGÉ"))cpJ++;
          else if(up==="RTT")rttJ++;
          else if(up==="MALADIE")malJ++;
          else if(up.includes("FERIE")||up.includes("FÉRIÉ"))fJ++;
        }
      }
      d.setDate(d.getDate()+1);
    }
    hT=Math.round(hT*10)/10; hFB=Math.round(hFB*10)/10; hFM=Math.round(hFM*10)/10;
    const hTheo=jo*H_STD, hTot=Math.round((hT+hS+hFM)*10)/10, ecart=Math.round((hTot-hTheo)*10)/10;
    return {hT,hS,hFB,hFM,hTheo,hTot,ecart,cpJ,rttJ,malJ,fJ,ftJ,jo};
  };

  const exportRecap = () => {
    const sep1 = '============================================================';
    const sep2 = '------------------------------------------------------------';
    const mLabel = frM(recapY,recapM).toUpperCase();
    let txt = sep1+'\n  COMPTE RENDU MENSUEL - '+mLabel+'\n'+sep1+'\n\n';
    employees.forEach(emp => {
      const s=monthStats(emp.id,recapY,recapM);
      txt += sep2+'\n  '+emp.name.toUpperCase()+'\n'+sep2+'\n';
      txt += '  Jours ouvres      : '+s.jo+'j\n';
      txt += '  Heures theoriques : '+s.hTheo+'h\n';
      txt += '  Heures travaillees: '+s.hT+'h\n';
      if(s.hS>0) txt += '  H. supplementaires: +'+s.hS+'h\n';
      if(s.ftJ>0) txt += '  Feries travailles : '+s.ftJ+'j - '+s.hFB+'h base x1.25 = '+s.hFM+'h\n';
      txt += '  TOTAL             : '+s.hTot+'h\n';
      const ec = s.ecart===0?'Parfait':(s.ecart>0?'+'+s.ecart+'h':s.ecart+'h');
      txt += '  Ecart / 35h sem   : '+ec+'\n\n';
      txt += '  Conges payes      : '+s.cpJ+'j\n';
      txt += '  RTT               : '+s.rttJ+'j\n';
      txt += '  Maladie           : '+s.malJ+'j\n';
      txt += '  Jours feries OFF  : '+s.fJ+'j\n';
      txt += sep2+'\n\n';
    });
    txt += '\nExport du '+new Date().toLocaleDateString('fr-FR')+' - Planning Equipe\n';
    const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='Compte_rendu_'+frM(recapY,recapM).split(' ').join('_')+'.txt';
    a.click();
    URL.revokeObjectURL(url);
  };

  const bs = {padding:'7px 14px',borderRadius:8,border:'1px solid #e0e0e0',background:'#fff',color:'#555',fontWeight:600,cursor:'pointer',fontSize:13};
  const lb = {display:'block',fontSize:11,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.4px',marginBottom:5};
  const ip = {width:'100%',border:'1.5px solid #e5e7eb',borderRadius:9,padding:'9px 11px',fontSize:13,color:'#1a1a2e',background:'#f8f9fa',boxSizing:'border-box'};

            {ABSENCES.map((a,ai)=>(
              <button key={a} onClick={()=>{setMAbs(a===mAbs?'':a);if(a!==mAbs){setMLieu('');setMDeb('');setMFin('');setMFerie(false);}}}
                style={{padding:'5px 10px',borderRadius:20,border:'1.5px solid '+(mAbs===a?'#dc2626':'#e5e7eb'),background:mAbs===a?'#dc2626':'#fff',color:mAbs===a?'#fff':'#555',fontWeight:600,fontSize:12,cursor:'pointer'}}>
                {ABSENCES_DISPLAY[ai]}
              </button>
            ))}
          </div>
          <label style={lb}>Heures supplementaires</label>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:18}}>
            <input type="number" min={0} max={12} step={0.5} value={mHS} onChange={e=>setMHS(e.target.value)}
              style={{width:75,border:'1.5px solid #e5e7eb',borderRadius:8,padding:'8px 10px',fontSize:14,textAlign:'center',background:'#f8f9fa'}}/>
            <span style={{color:'#888',fontSize:12}}>h supp. ce jour</span>
          </div>
          <div style={{display:'flex',gap:7}}>
            <button onClick={saveModal} style={{flex:1,padding:'11px 0',borderRadius:9,border:'none',background:'#1a6ed8',color:'#fff',fontWeight:800,fontSize:14,cursor:'pointer'}}>Enregistrer</button>
            <button onClick={clearModal} style={{padding:'11px 12px',borderRadius:9,border:'1px solid #fca5a5',background:'#fde8e8',color:'#dc2626',fontWeight:700,fontSize:13,cursor:'pointer'}}>Effacer</button>
            <button onClick={()=>setModal(null)} style={{padding:'11px 12px',borderRadius:9,border:'1px solid #e5e7eb',background:'#f8f9fa',color:'#888',fontWeight:600,fontSize:13,cursor:'pointer'}}>Annuler</button>
          </div>
        </div>
      </div>
    );
  };

  if(!sesOk) return null;
  if(!session) return React.createElement(Login,{onLogin:s=>setSession(s)});

  return (
    <div style={{minHeight:'100vh',background:'#f5f6f8',fontFamily:"'Segoe UI',Arial,sans-serif"}}>
      <div style={{background:'#fff',borderBottom:'1px solid #e5e7eb',padding:isMobile?'8px 12px':'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,boxShadow:'0 1px 3px rgba(0,0,0,0.05)',position:'sticky',top:0,zIndex:10}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:isMobile?28:32,height:isMobile?28:32,background:'linear-gradient(135deg,#1a6ed8,#8b1ad6)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:isMobile?14:16}}>
            <span>&#128197;</span>
          </div>
          {!isMobile&&<div>
            <div style={{fontSize:14,fontWeight:800,color:'#1a1a2e',lineHeight:1}}>Planning Equipe</div>
            <div style={{fontSize:9,color:sync.includes('Synchro')?'#059669':sync.includes('Err')?'#dc2626':'#d97706',fontWeight:600}}>{sync}</div>
          </div>}
          {isMobile&&<div style={{fontSize:9,color:sync.includes('Synchro')?'#059669':sync.includes('Err')?'#dc2626':'#d97706',fontWeight:700}}>{sync}</div>}
        </div>
        <div style={{display:'flex',gap:isMobile?4:5,flexWrap:'nowrap',overflowX:'auto'}}>
          {nb('planning',isMobile?'📅':'📅 Planning')}
          {nb('conges',isMobile?'🏖️':'🏖️ Congés')}
          {nb('recap',isMobile?'📊':'📊 Compte rendu')}
          {isAdmin&&nb('equipe',isMobile?'👥':'👥 Équipe')}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {!isMobile&&<div style={{textAlign:'right',lineHeight:1.3}}>
            <div style={{fontSize:12,fontWeight:700,color:'#1a1a2e'}}>{session.user}</div>
            <div style={{fontSize:10,color:isAdmin?'#8b1ad6':'#1a6ed8',fontWeight:600}}>{isAdmin?'Admin':'Lecteur'}</div>
          </div>}
          <button onClick={()=>{clearS();setSession(null);}} style={{padding:isMobile?'6px 8px':'6px 10px',borderRadius:7,border:'1px solid #e5e7eb',background:'#f8f9fa',color:'#888',fontWeight:600,fontSize:11,cursor:'pointer'}}>{isMobile?'↩':'Deconnexion'}</button>
        </div>
      </div>
      {!isAdmin&&(
        <div style={{background:'#fffbeb',borderBottom:'1px solid #fde68a',padding:'6px 16px',fontSize:11,color:'#d97706',fontWeight:600}}>
          Mode consultation - Seule Laetitia peut modifier le planning.
        </div>
      )}
      <div style={{padding:isMobile?'10px 10px':'16px',maxWidth:1400,margin:'0 auto'}}>
        {view==='planning'&&renderPlanning()}
        {view==='conges'&&renderConges()}
        {view==='recap'&&renderRecap()}
        {view==='equipe'&&renderEquipe()}
      </div>
      {isAdmin&&renderModal()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
