<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Planning Équipe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f0f2f5;font-family:'Segoe UI',Arial,sans-serif;color:#1a1a2e;font-size:14px;}
input,select,button,textarea{font-family:inherit;font-size:14px;outline:none;}

::-webkit-scrollbar-track{background:#f1f1f1;}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}

</head>
<body>
<div id="root"></div>
<script type="text/babel">

const SK = "planningEquipeV4";
const save = d => { try{localStorage.setItem(SK,JSON.stringify(d));}catch{} };
const load = () => { try{const v=localStorage.getItem(SK);if(v)return JSON.parse(v);}catch{} return null; };

const JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const H_STD = 7; // heures par jour standard
const H_SEM = 35; // heures par semaine

const LIEUX = ["Bureau","Château","T-C","Tours N","Réunion","Formation"];
const ABSENCES = ["OFF","Congé","RTT","Maladie","OFF/Férié","Absence"];
const ALL_PRESETS = [...LIEUX, ...ABSENCES];

// Couleurs par employé
const EMP_STYLES = [
  {bg:"#fce8f3", accent:"#d63384", light:"#fdf0f8"},
  {bg:"#e8f0fc", accent:"#1a6ed8", light:"#f0f5fe"},
  {bg:"#fceee8", accent:"#d6530a", light:"#fdf5f0"},
  {bg:"#e8fcf0", accent:"#1ab86b", light:"#f0fef5"},
  {bg:"#f0e8fc", accent:"#8b1ad6", light:"#f8f0fe"},
  {bg:"#fafce8", accent:"#b8a81a", light:"#fefdf0"},
  {bg:"#e8f8fc", accent:"#1ab0d6", light:"#f0fcfe"},
  {bg:"#fce8e8", accent:"#d61a1a", light:"#fef0f0"},
];

const DEFAULT_EMP = [
  {id:"e1",name:"Laetitia"},
  {id:"e2",name:"Nicolas"},
  {id:"e3",name:"Charlotte"},
  {id:"e4",name:"Marco"},
  {id:"e5",name:"Alan"},
  {id:"e6",name:"Corentin"},
];

// ── Utilitaires dates ─────────────────────────────────────────────────────────
const pad = n => String(n).padStart(2,'0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

// Lundi de la semaine contenant d
const getMondayOf = d => {
  const r = new Date(d);
  const day = r.getDay();
  const diff = (day===0)?-6:1-day;
  r.setDate(r.getDate()+diff);
  r.setHours(0,0,0,0);
  return r;
};

const addDays = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };

const frDate = d => d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});

const getWeekDays = (monday) => Array.from({length:7},(_,i)=>addDays(monday,i));

// Calcul heures depuis tranche "HHhMM/HHhMM" ou "HHh/HHh"
const parseHeures = (tranche) => {
  if (!tranche) return 0;
  const s = tranche.trim().toUpperCase();
  // OFF / absences = 0h travaillées
  if (["OFF","OFF/FÉRIÉ","OFF/FERIE","CONGE","CONGÉ","RTT","MALADIE","ABSENCE"].some(x=>s===x||s.startsWith(x))) return 0;
  // Format HH:MM/HH:MM ou HHhMM/HHhMM ou HHh/HHh
  const re = /(\d{1,2})[h:]?(\d{0,2})\s*[\/\-]\s*(\d{1,2})[h:]?(\d{0,2})/;
  const m = s.match(re);
  if (!m) return 0;
  const debut = parseInt(m[1])*60 + (m[2]?parseInt(m[2]||0):0);
  const fin   = parseInt(m[3])*60 + (m[4]?parseInt(m[4]||0):0);
  const diff  = fin - debut;
  if (diff <= 0) return 0;
  // Déduire 1h de pause si > 6h
  return (diff > 360 ? diff - 60 : diff) / 60;
};

const isAbsence = val => {
  if (!val) return false;
  const v = val.trim().toUpperCase();
  return ["OFF","OFF/FÉRIÉ","OFF/FERIE","CONGE","CONGÉ","RTT","MALADIE","ABSENCE"].some(x=>v===x||v.startsWith(x));
};

const getCellColor = (val, empStyle) => {
  if (!val) return '#fff';
  const v = val.trim().toUpperCase();
  if (v==="OFF" || v==="") return '#f8f8f8';
  if (v.includes("FÉRIÉ") || v.includes("FERIE")) return '#fff3cd';
  if (v.includes("CONGÉ") || v.includes("CONGE")) return '#d4edda';
  if (v==="RTT") return '#cce5ff';
  if (v==="MALADIE") return '#f8d7da';
  if (v.includes("T-C")) return '#e2d9f3';
  if (v.includes("TOURS N")) return '#e8f5e9';
  if (v.includes("CHÂTEAU") || v.includes("CHATEAU")) return '#fff3cd';
  if (v.includes("FORMATION")) return '#d4edda';
  if (v.includes("RÉUNION") || v.includes("REUNION")) return '#f8d7da';
  return empStyle.light;
};

const getCellTextColor = (val) => {
  if (!val) return '#aaa';
  const v = val.trim().toUpperCase();
  if (v==="OFF") return '#999';
  if (v.includes("FÉRIÉ") || v.includes("FERIE")) return '#856404';
  if (v.includes("CONGÉ") || v.includes("CONGE")) return '#155724';
  if (v==="RTT") return '#004085';
  if (v==="MALADIE") return '#721c24';
  if (v.includes("T-C")) return '#4a1d96';
  if (v.includes("TOURS N")) return '#2e7d32';
  if (v.includes("CHÂTEAU") || v.includes("CHATEAU")) return '#7c5200';
  if (v.includes("FORMATION")) return '#155724';
  return '#333';
};

// ── Utilisateurs & rôles ──────────────────────────────────────────────────────
const USERS = [
  {user:"Laetitia",  pass:"Boutique2014!", role:"admin"},
  {user:"Nicolas",   pass:"12345",         role:"lecteur"},
  {user:"Charlotte", pass:"12345",         role:"lecteur"},
  {user:"Marco",     pass:"12345",         role:"lecteur"},
  {user:"Alan",      pass:"12345",         role:"lecteur"},
  {user:"Corentin",  pass:"12345",         role:"lecteur"},
];

const SESSION_KEY = "planningSession";
const saveSession = s => { try{localStorage.setItem(SESSION_KEY,JSON.stringify(s));}catch{} };
const loadSession = () => { try{const v=localStorage.getItem(SESSION_KEY);if(v)return JSON.parse(v);}catch{} return null; };
const clearSession = () => { try{localStorage.removeItem(SESSION_KEY);}catch{} };

// ── Écran de connexion ────────────────────────────────────────────────────────
function Login({onLogin}) {
  const [user, setUser]   = React.useState("");
  const [pass, setPass]   = React.useState("");
  const [err,  setErr]    = React.useState("");
  const [showP, setShowP] = React.useState(false);

  const handleLogin = () => {
    const found = USERS.find(u => u.user.toLowerCase()===user.trim().toLowerCase() && u.pass===pass.trim());
    if (found) {
      const session = {user: found.user, role: found.role};
      saveSession(session);
      onLogin(session);
    } else {
      setErr("Identifiant ou mot de passe incorrect.");
      setTimeout(()=>setErr(""), 3000);
    }
  };

  return (
    <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Segoe UI',Arial,sans-serif"}}>
      <div style={{background:'#fff',borderRadius:20,padding:40,width:380,maxWidth:'calc(100vw - 32px)',boxShadow:'0 30px 80px #0005'}}>
        {/* Logo */}
        <div style={{textAlign:'center',marginBottom:32}}>
          <div style={{width:60,height:60,background:'linear-gradient(135deg,#1a6ed8,#8b1ad6)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,margin:'0 auto 14px'}}>📅</div>
          <div style={{fontSize:22,fontWeight:800,color:'#1a1a2e',letterSpacing:'-0.5px'}}>Planning Équipe</div>
          <div style={{fontSize:12,color:'#aaa',marginTop:4}}>Connectez-vous pour accéder au planning</div>
        </div>

        {/* Champs */}
        <div style={{marginBottom:14}}>
          <label style={{display:'block',fontSize:11,color:'#888',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:6}}>Identifiant</label>
          <input
            value={user}
            onChange={e=>setUser(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&handleLogin()}
            placeholder="Votre prénom"
            style={{width:'100%',border:'1.5px solid #e5e7eb',borderRadius:10,padding:'11px 14px',fontSize:14,color:'#1a1a2e',background:'#f8f9fa',boxSizing:'border-box'}}
            autoFocus
          />
        </div>
        <div style={{marginBottom:20}}>
          <label style={{display:'block',fontSize:11,color:'#888',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:6}}>Mot de passe</label>
          <div style={{position:'relative'}}>
            <input
              type={showP?'text':'password'}
              value={pass}
              onChange={e=>setPass(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&handleLogin()}
              placeholder="••••••••"
              style={{width:'100%',border:'1.5px solid #e5e7eb',borderRadius:10,padding:'11px 40px 11px 14px',fontSize:14,color:'#1a1a2e',background:'#f8f9fa',boxSizing:'border-box'}}
            />
            <button onClick={()=>setShowP(p=>!p)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:16,color:'#aaa'}}>
              {showP?'🙈':'👁️'}
            </button>
          </div>
        </div>

        {/* Erreur */}
        {err && (
          <div style={{background:'#fce8e8',border:'1px solid #f8d7da',borderRadius:8,padding:'10px 14px',color:'#d63384',fontSize:13,fontWeight:600,marginBottom:16,textAlign:'center'}}>
            ⚠️ {err}
          </div>
        )}

        <button
          onClick={handleLogin}
          style={{width:'100%',padding:'13px 0',borderRadius:10,border:'none',background:'linear-gradient(135deg,#1a6ed8,#8b1ad6)',color:'#fff',fontWeight:800,fontSize:15,cursor:'pointer',boxShadow:'0 4px 15px #1a6ed844',letterSpacing:'0.2px'}}
        >
          Se connecter →
        </button>

        <div style={{textAlign:'center',marginTop:20,fontSize:11,color:'#ccc'}}>
          🔒 Accès sécurisé · Planning Équipe
        </div>
      </div>
    </div>
  );
}

// ── Composant principal ───────────────────────────────────────────────────────
function App() {
  const today = new Date();

  // ⚠️ Tous les hooks DOIVENT être déclarés avant tout return conditionnel
  const [session, setSession]       = React.useState(null);
  const [sessionLoaded, setSessionLoaded] = React.useState(false);
  const [employees, setEmployees]   = React.useState(DEFAULT_EMP);
  const [cells, setCells]           = React.useState({});
  const [monday, setMonday]         = React.useState(getMondayOf(today));
  const [view, setView]             = React.useState("calendrier");
  const [calMonth, setCalMonth]     = React.useState(today.getMonth());
  const [calYear,  setCalYear]      = React.useState(today.getFullYear());
  const [modal, setModal]           = React.useState(null);
  const [mVal, setMVal]             = React.useState("");
  const [mHS,  setMHS]              = React.useState(0);
  const [mCustom, setMCustom]       = React.useState("");
  const [newName, setNewName]       = React.useState("");
  const [recapMonth, setRecapMonth] = React.useState(today.getMonth());
  const [recapYear,  setRecapYear]  = React.useState(today.getFullYear());

  const isAdmin = session?.role === "admin";

  // Charger session
  React.useEffect(() => {
    const s = loadSession();
    if (s) setSession(s);
    setSessionLoaded(true);
  }, []);

  // Charger données planning
  React.useEffect(() => {
    const d = load();
    if (d) {
      if (d.employees) setEmployees(d.employees);
      if (d.cells)     setCells(d.cells);
    }
  }, []);

  // Sauvegarder données planning
  React.useEffect(() => {
    save({employees, cells});
  }, [employees, cells]);

  const weekDays = React.useMemo(() => getWeekDays(monday), [monday]);

  // Returns conditionnels APRÈS tous les hooks
  if (!sessionLoaded) return null;
  if (!session) return <Login onLogin={s => setSession(s)} />;

  const navWeek = dir => setMonday(prev => addDays(prev, dir*7));

  const openModal = (empId, date, dayIdx) => {
    const k = dk(date);
    const c = (cells[empId]||{})[k] || {};
    setMVal(c.val||"");
    setMHS(c.hsupp||0);
    setMCustom("");
    setModal({empId, date, k, dayIdx});
  };

  const saveModal = () => {
    if (!modal) return;
    const {empId, k} = modal;
    const finalVal = mVal==="__custom__" ? mCustom : mVal;
    setCells(prev => {
      const n = {...prev, [empId]: {...(prev[empId]||{})}};
      if (finalVal || Number(mHS)>0) {
        n[empId][k] = {val: finalVal, hsupp: Number(mHS)||0};
      } else {
        delete n[empId][k];
      }
      return n;
    });
    setModal(null);
  };

  const clearModal = () => {
    if (!modal) return;
    const {empId, k} = modal;
    setCells(prev => {
      const n = {...prev, [empId]: {...(prev[empId]||{})}};
      delete n[empId][k];
      return n;
    });
    setModal(null);
  };

  // ── Stats semaine pour un employé ──
  const getWeekStats = (empId, wDays) => {
    const ec = cells[empId]||{};
    let total=0, hsupp=0, absCount=0;
    wDays.forEach(d => {
      const c = ec[dk(d)];
      if (!c) return;
      const h = parseHeures(c.val);
      total += h;
      if (c.hsupp) hsupp += Number(c.hsupp);
      if (isAbsence(c.val)) absCount++;
    });
    return {total: Math.round(total*10)/10, hsupp, diff: Math.round((total+hsupp-H_SEM)*10)/10, absCount};
  };

  // ── Stats mois pour recap ──
  const getMonthStats = (empId, year, month) => {
    const ec = cells[empId]||{};
    // Tous les jours du mois
    const d = new Date(year, month, 1);
    let hTravail=0, hSupp=0, cpJ=0, rttJ=0, malJ=0, ferieJ=0, absJ=0, offJ=0;
    while (d.getMonth()===month) {
      const day = d.getDay(); // 0=dim, 6=sam
      const isWE = day===0||day===6;
      const c = ec[dk(d)];
      if (c) {
        const v = (c.val||"").trim().toUpperCase();
        const h = parseHeures(c.val);
        hTravail += h;
        if (c.hsupp) hSupp += Number(c.hsupp);
        if (v.includes("CONGÉ")||v.includes("CONGE")) cpJ++;
        else if (v==="RTT") rttJ++;
        else if (v==="MALADIE") malJ++;
        else if (v.includes("FÉRIÉ")||v.includes("FERIE")) ferieJ++;
        else if (v==="OFF"&&!isWE) offJ++;
        else if (v==="ABSENCE") absJ++;
      }
      d.setDate(d.getDate()+1);
    }
    // Jours ouvrés du mois
    const d2 = new Date(year, month, 1);
    let jouvres=0;
    while (d2.getMonth()===month) {
      const day=d2.getDay();
      if(day!==0&&day!==6) jouvres++;
      d2.setDate(d2.getDate()+1);
    }
    const hTheo = jouvres * H_STD;
    const hTotales = hTravail + hSupp;
    const ecart = Math.round((hTotales - hTheo)*10)/10;
    return {hTravail:Math.round(hTravail*10)/10, hSupp, hTheo, hTotales:Math.round(hTotales*10)/10, ecart, cpJ, rttJ, malJ, ferieJ, absJ, offJ, jouvres};
  };

  // Semaines du mois pour recap
  const getMonthWeeks = (year, month) => {
    const weeks = [];
    const d = new Date(year, month, 1);
    let mon = getMondayOf(d);
    // S'assurer qu'on commence bien dans le mois
    const lastDay = new Date(year, month+1, 0);
    while (mon <= lastDay) {
      const wDays = getWeekDays(mon).filter(d => d.getMonth()===month && d.getDay()!==0 && d.getDay()!==6);
      if (wDays.length > 0) weeks.push({mon: new Date(mon), wDays});
      mon = addDays(mon, 7);
    }
    return weeks;
  };

  const empStyle = idx => EMP_STYLES[idx % EMP_STYLES.length];

  // ── CALENDRIER VUE D'ENSEMBLE ─────────────────────────────────────────────
  const navCal = dir => {
    let m=calMonth+dir, y=calYear;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    setCalMonth(m); setCalYear(y);
  };

  const frMonthLabelCal = (y,m) => new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});

  const renderCalendrier = () => {
    // Tous les jours du mois
    const firstDay = new Date(calYear, calMonth, 1);
    const lastDay  = new Date(calYear, calMonth+1, 0);
    const allDays  = [];
    const d = new Date(firstDay);
    while (d <= lastDay) { allDays.push(new Date(d)); d.setDate(d.getDate()+1); }
    // Jours ouvrés uniquement (lun-ven)
    const workDaysCal = allDays.filter(d => d.getDay()!==0 && d.getDay()!==6);

    // Semaines (par lundi)
    const weeks = [];
    let mon = getMondayOf(firstDay);
    while (mon <= lastDay) {
      weeks.push(getWeekDays(mon));
      mon = addDays(mon, 7);
    }

    return (
      <div>
        {/* Header calendrier */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,flexWrap:'wrap',gap:12}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <h2 style={{fontSize:24,fontWeight:800,color:'#1a1a2e',textTransform:'capitalize'}}>{frMonthLabelCal(calYear,calMonth)}</h2>
            <div style={{display:'flex',gap:6}}>
              <button onClick={()=>navCal(-1)} style={bS}>‹</button>
              <button onClick={()=>{setCalMonth(today.getMonth());setCalYear(today.getFullYear());}} style={{...bS,background:'#1a6ed8',color:'#fff',border:'none'}}>Aujourd'hui</button>
              <button onClick={()=>navCal(1)} style={bS}>›</button>
            </div>
          </div>
          {/* Mini stats équipe */}
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {employees.map((emp,ei)=>{
              const es=empStyle(ei);
              const s=getMonthStats(emp.id,calYear,calMonth);
              return (
                <div key={emp.id} style={{background:'#fff',borderRadius:8,padding:'6px 12px',border:`2px solid ${es.accent}`,display:'flex',alignItems:'center',gap:6,fontSize:12}}>
                  <span style={{color:es.accent,fontWeight:700}}>{emp.name}</span>
                  <span style={{color:s.ecart>=0?'#1ab86b':'#d63384',fontWeight:700}}>{s.hTotales}h</span>
                  {s.cpJ>0&&<span style={{background:'#d4edda',color:'#155724',borderRadius:4,padding:'0 4px',fontSize:10,fontWeight:700}}>{s.cpJ}j CP</span>}
                  {s.hSupp>0&&<span style={{background:'#fff8e1',color:'#f57c00',borderRadius:4,padding:'0 4px',fontSize:10,fontWeight:700}}>+{s.hSupp}h⚡</span>}
                </div>
              );
            })}
          </div>
        </div>

        {/* Légende */}
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}}>
          {[
            {label:"Bureau",bg:"#e8f0fc",c:"#1a6ed8"},
            {label:"Château",bg:"#fff3cd",c:"#856404"},
            {label:"T-C",bg:"#e2d9f3",c:"#4a1d96"},
            {label:"Tours N",bg:"#e8f5e9",c:"#2e7d32"},
            {label:"Congé",bg:"#d4edda",c:"#155724"},
            {label:"RTT",bg:"#cce5ff",c:"#004085"},
            {label:"Maladie",bg:"#f8d7da",c:"#721c24"},
            {label:"OFF/Férié",bg:"#fff3cd",c:"#856404"},
            {label:"⚡ H.Supp",bg:"#fff8e1",c:"#f57c00"},
          ].map(({label,bg,c})=>(
            <span key={label} style={{background:bg,color:c,border:`1px solid ${c}44`,borderRadius:5,padding:'2px 7px',fontSize:10,fontWeight:600}}>{label}</span>
          ))}
        </div>

        {/* Grille calendrier */}
        <div style={{overflowX:'auto'}}>
          <table style={{borderCollapse:'collapse',width:'100%',minWidth:900,background:'#fff',borderRadius:12,overflow:'hidden',boxShadow:'0 2px 12px #0001',border:'1px solid #e5e7eb'}}>
            <thead>
              <tr style={{background:'#f8f9fa'}}>
                <th style={{padding:'10px 14px',fontWeight:700,fontSize:12,color:'#555',textAlign:'left',borderBottom:'2px solid #e5e7eb',width:110,position:'sticky',left:0,background:'#f8f9fa',zIndex:3}}>Employé</th>
                {weeks.map((wDays,wi)=>
                  wDays.filter(d=>d.getDay()!==0&&d.getDay()!==6).map((d,di)=>{
                    const isT = dk(d)===dk(today);
                    const inMonth = d.getMonth()===calMonth;
                    return (
                      <th key={dk(d)} style={{padding:'6px 4px',fontWeight:600,fontSize:10,color:!inMonth?'#ddd':isT?'#1a6ed8':'#888',textAlign:'center',borderBottom:'2px solid #e5e7eb',borderLeft:di===0?'2px solid #e5e7eb':'1px solid #f0f0f0',minWidth:62,background:isT?'#eef4ff':'#f8f9fa'}}>
                        <div style={{fontWeight:700}}>{JOURS[d.getDay()-1]?.slice(0,3)||''}</div>
                        <div style={{fontSize:12,fontWeight:isT?800:600,color:isT?'#1a6ed8':!inMonth?'#ccc':'#666'}}>{d.getDate()}</div>
                        {di===0&&<div style={{fontSize:9,color:'#bbb',marginTop:1}}>S{Math.ceil(((d-new Date(d.getFullYear(),0,1))/86400000+1)/7)}</div>}
                      </th>
                    );
                  })
                )}
                <th style={{padding:'10px 8px',fontWeight:700,fontSize:11,color:'#555',textAlign:'center',borderBottom:'2px solid #e5e7eb',borderLeft:'2px solid #e5e7eb',minWidth:80,background:'#f8f9fa'}}>Total mois</th>
              </tr>
            </thead>
            <tbody>
              {employees.map((emp,ei)=>{

          <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:16}}>
            {/* Lieux */}
            <div style={{width:'100%',fontSize:10,color:'#aaa',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:2}}>Lieux de travail</div>
            {LIEUX.map(p=>(
              <button key={p} onClick={()=>{setMVal(p);}}
                style={{padding:'4px 10px',borderRadius:20,border:`1px solid ${mVal===p?'#1a6ed8':'#ddd'}`,background:mVal===p?'#1a6ed8':'#f8f8f8',color:mVal===p?'#fff':'#555',fontWeight:600,fontSize:12,cursor:'pointer'}}>
                {p}
              </button>
            ))}
            <div style={{width:'100%',fontSize:10,color:'#aaa',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:2,marginTop:6}}>Absences</div>
            {ABSENCES.map(p=>(
              <button key={p} onClick={()=>{setMVal(p);}}
                style={{padding:'4px 10px',borderRadius:20,border:`1px solid ${mVal===p?'#d63384':'#ddd'}`,background:mVal===p?'#d63384':'#f8f8f8',color:mVal===p?'#fff':'#555',fontWeight:600,fontSize:12,cursor:'pointer'}}>
                {p}
              </button>
            ))}
          </div>

          {/* Heures supp */}
          <label style={lbl}>Heures supplémentaires ce jour ⚡</label>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:20}}>
            <input type="number" min={0} max={12} step={0.5} value={mHS} onChange={e=>setMHS(e.target.value)}
              style={{...inputSt,width:90,marginBottom:0}}/>
            <span style={{color:'#888',fontSize:12}}>heures supplémentaires</span>
          </div>

          {/* Aperçu calcul */}
          {mVal && !isAbsence(mVal) && parseHeures(mVal)>0 && (
            <div style={{background:'#f0f8ff',borderRadius:8,padding:'8px 12px',marginBottom:16,fontSize:12,color:'#1a6ed8',border:'1px solid #cce5ff'}}>
              ⏱ Durée calculée : <strong>{parseHeures(mVal)}h</strong>
              {mHS>0&&<> + <strong>{mHS}h supp</strong> = <strong>{Math.round((parseHeures(mVal)+Number(mHS))*10)/10}h</strong></>}
              <span style={{color:'#999',marginLeft:6}}>(pause déduite si &gt;6h)</span>
            </div>
          )}

          <div style={{display:'flex',gap:8}}>
            <button onClick={saveModal} style={{flex:1,padding:'10px 0',borderRadius:8,border:'none',background:'#1a6ed8',color:'#fff',fontWeight:700,fontSize:14,cursor:'pointer'}}>✓ Enregistrer</button>
            <button onClick={clearModal} style={{padding:'10px 14px',borderRadius:8,border:'1px solid #f8d7da',background:'#fce8e8',color:'#d63384',fontWeight:700,fontSize:13,cursor:'pointer'}}>✕ Effacer</button>
            <button onClick={()=>setModal(null)} style={{padding:'10px 14px',borderRadius:8,border:'1px solid #ddd',background:'#f8f8f8',color:'#888',fontWeight:600,fontSize:13,cursor:'pointer'}}>Annul.</button>
          </div>
        </div>
      </div>
    );
  };

  // ── Styles partagés ───────────────────────────────────────────────────────
  const th = {padding:'10px 12px',background:'#fff',color:'#555',fontWeight:700,fontSize:12,textAlign:'center',borderBottom:'2px solid #eee'};
  const td = {padding:'7px 10px',fontSize:12,color:'#444',verticalAlign:'middle'};
  const btnStyle = {padding:'7px 14px',borderRadius:8,border:'1px solid #ddd',background:'#fff',color:'#555',fontWeight:600,cursor:'pointer',fontSize:13};
  const bS = {padding:'6px 12px',borderRadius:7,border:'1px solid #ddd',background:'#fff',color:'#555',fontWeight:600,cursor:'pointer',fontSize:13};
  const lbl = {display:'block',fontSize:11,color:'#888',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.4px',marginBottom:6};
  const inputSt = {width:'100%',border:'1px solid #ddd',borderRadius:8,padding:'9px 12px',fontSize:13,color:'#1a1a2e',background:'#fafafa'};

  const navBtn = (v,label) => (
    <button onClick={()=>setView(v)} style={{padding:'8px 18px',borderRadius:8,cursor:'pointer',fontSize:13,fontWeight:700,background:view===v?'#1a6ed8':'#fff',color:view===v?'#fff':'#555',boxShadow:view===v?'0 2px 8px #1a6ed844':'none',border:view===v?'1px solid #1a6ed8':'1px solid #e5e7eb'}}>
      {label}
    </button>
  );

  return (
    <div style={{minHeight:'100vh',background:'#f0f2f5',fontFamily:"'Segoe UI',Arial,sans-serif"}}>
      {/* Header */}
      <div style={{background:'#fff',borderBottom:'1px solid #e5e7eb',padding:'12px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12,boxShadow:'0 1px 4px #0001'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:36,height:36,background:'linear-gradient(135deg,#1a6ed8,#8b1ad6)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>📅</div>
          <div>
            <div style={{fontSize:17,fontWeight:800,color:'#1a1a2e',letterSpacing:'-0.3px'}}>Planning Équipe</div>
            <div style={{fontSize:11,color:'#aaa'}}>35h/semaine · {employees.length} collaborateurs</div>
          </div>
        </div>
        <div style={{display:'flex',gap:6}}>
          {navBtn("calendrier","🗓 Calendrier")}
          {navBtn("planning","📅 Planning")}
          {navBtn("recap","📊 Compte rendu")}
          {isAdmin && navBtn("equipe","👥 Équipe")}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:13,fontWeight:700,color:'#1a1a2e'}}>👤 {session.user}</div>
            <div style={{fontSize:10,color:isAdmin?'#8b1ad6':'#1a6ed8',fontWeight:600}}>{isAdmin?'✏️ Administrateur':'👁 Lecteur'}</div>
          </div>
          <button onClick={()=>{clearSession();setSession(null);}} style={{padding:'7px 12px',borderRadius:8,border:'1px solid #e5e7eb',background:'#f8f9fa',color:'#888',fontWeight:600,fontSize:12,cursor:'pointer'}}>
            Déconnexion
          </button>
        </div>
      </div>

      {/* Bandeau lecteur */}
      {!isAdmin && (
        <div style={{background:'#fff8e1',borderBottom:'1px solid #ffe082',padding:'8px 24px',display:'flex',alignItems:'center',gap:8,fontSize:12,color:'#f57c00',fontWeight:600}}>
          👁 Mode consultation — Vous pouvez voir le planning mais pas le modifier. Seule Laetitia peut effectuer des modifications.
        </div>
      )}

      {/* Content */}
      <div style={{padding:24,maxWidth:1400,margin:'0 auto'}}>
        {view==="calendrier" && renderCalendrier()}
        {view==="planning" && renderPlanning()}
        {view==="recap"    && renderRecap()}
        {view==="equipe"   && renderEquipe()}
      </div>

      {isAdmin && renderModal()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
