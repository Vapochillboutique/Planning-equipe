const getMon=d=>{const r=new Date(d);const day=r.getDay();r.setDate(r.getDate()+(day===0?-6:1-day));r.setHours(0,0,0,0);return r;};

const jouv=(d1,d2)=>{
  let d=new Date(d1),n=0;
  while(d<=d2){if(d.getDay()!==0)n++;d.setDate(d.getDate()+1);}
  return n;
};

const parseH=(val,jn)=>{
  if(!val)return 0;
  const up=val.trim().toUpperCase();
  if(up==="OFF/FERIE"||up==="OFF/F\u00c9RI\u00c9")return H_STD;
  const isA=["OFF","CONGE","CONG\u00c9","RTT","MALADIE","ABSENCE"].some(x=>up===x||up.startsWith(x+" "));
  const isFT=up.includes("FERIE TRAVAIL");
  if(isA&&!isFT)return 0;
  const mt=val.match(/(\d{1,2})[hH](\d{2})\s*[\/\-]\s*(\d{1,2})[hH](\d{2})/i);
  if(!mt)return 0;
  const a=parseInt(mt[1])*60+parseInt(mt[2]);
  const b=parseInt(mt[3])*60+parseInt(mt[4]);
  const diff=b-a;
  if(diff<=0)return 0;
  const isCh=up.includes("CHATEAU");
  const isSam=jn===6;
  let pause=0;
  if(diff>360)pause=isCh?(isSam?60:90):60;
  return Math.round((diff-pause)/60*10)/10;
};

const cBg=(val,ei)=>{
  if(!val)return"#fff";
  const up=val.trim().toUpperCase();
  if(up==="OFF")return"#f8f8f8";
  if(up.includes("FERIE TRAVAIL"))return"#fff0e0";
  if(up.includes("FERIE")||up.includes("F\u00c9RI\u00c9"))return"#fff8e1";
  if(up.includes("CONGE")||up.includes("CONG\u00c9"))return"#e8f8f0";
  if(up==="RTT")return"#e8f0ff";
  if(up==="MALADIE")return"#fde8e8";
  if(up.includes("BLERE")||up.includes("BL\u00c9R\u00c9"))return"#fce4ec";
  if(up.includes("T-C"))return"#ede8ff";
  if(up.includes("TOURS"))return"#e8f8ee";
  if(up.includes("CHATEAU")||up.includes("CH\u00c2TEAU"))return"#fff8e1";
  return eb(ei);
};

const cTxt=val=>{
  if(!val)return"#ccc";
  const up=val.trim().toUpperCase();
  if(up==="OFF")return"#aaa";
  if(up.includes("FERIE TRAVAIL"))return"#c2410c";
  if(up.includes("FERIE")||up.includes("F\u00c9RI\u00c9"))return"#b45309";
  if(up.includes("CONGE")||up.includes("CONG\u00c9"))return"#065f46";
  if(up==="RTT")return"#1e40af";
  if(up==="MALADIE")return"#991b1b";
  if(up.includes("BLERE")||up.includes("BL\u00c9R\u00c9"))return"#880e4f";
  if(up.includes("T-C"))return"#4c1d95";
  if(up.includes("TOURS"))return"#14532d";
  if(up.includes("CHATEAU")||up.includes("CH\u00c2TEAU"))return"#78350f";
  return"#1a1a2e";
};

const getMW=(y,m)=>{
  const weeks=[],last=new Date(y,m+1,0);
  let mon=getMon(new Date(y,m,1));
  while(mon<=last){
    const wd=getWD(mon).filter(d=>d.getMonth()===m&&!isWE(d));
    if(wd.length)weeks.push({mon:new Date(mon),wd});
    mon=addD(mon,7);
  }
  return weeks;
};

function App(){
  const today=new Date();
  const [session,setSession]=React.useState(null);
  const [sesOk,setSesOk]=React.useState(false);
  const [fbOk,setFbOk]=React.useState(false);
  const [sync,setSync]=React.useState("Connexion...");
  const [emps,setEmps]=React.useState(DEMP);
  const [cells,setCells]=React.useState({});
  const [conges,setConges]=React.useState([]);
  const [view,setView]=React.useState("planning");
  const [mon,setMon]=React.useState(getMon(today));
  const [cgM,setCgM]=React.useState(today.getMonth());
  const [cgY,setCgY]=React.useState(today.getFullYear());
  const [recM,setRecM]=React.useState(today.getMonth());
  const [recY,setRecY]=React.useState(today.getFullYear());
  const [mob,setMob]=React.useState(window.innerWidth<=640);
  const [modal,setModal]=React.useState(null);
  const [mLieu,setMLieu]=React.useState("");
  const [mAbs,setMAbs]=React.useState("");
  const [mDeb,setMDeb]=React.useState("");
  const [mFin,setMFin]=React.useState("");
  const [mHS,setMHS]=React.useState(0);
  const [mFer,setMFer]=React.useState(false);
  const [cgEmp,setCgEmp]=React.useState("");
  const [cgTyp,setCgTyp]=React.useState("Conge");
  const [cgDeb,setCgDeb]=React.useState("");
  const [cgFin,setCgFin]=React.useState("");
  const [cgNot,setCgNot]=React.useState("");
  const [selS,setSelS]=React.useState(null);
  const [selE,setSelE]=React.useState(null);
  const [hovD,setHovD]=React.useState(null);
  const [newN,setNewN]=React.useState("");

  const isA=session&&session.role==="admin";
  const hSem=id=>{const e=emps.find(x=>x.id===id);return e&&e.hSem?e.hSem:35;};

  React.useEffect(()=>{const s=ldS();if(s)setSession(s);setSesOk(true);},[]);
  React.useEffect(()=>{
    const h=()=>setMob(window.innerWidth<=640);
    window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);
  },[]);
  React.useEffect(()=>{
    if(window.__fbReady){setFbOk(true);return;}
    const h=()=>setFbOk(true);
    window.addEventListener("fbReady",h);return()=>window.removeEventListener("fbReady",h);
  },[]);

  React.useEffect(()=>{
    if(!fbOk||!session)return;
    const {db,onSnapshot,collection:col,doc}=window.__fb;
    const u1=onSnapshot(doc(db,"planning","cells"),snap=>{if(snap.exists())setCells(snap.data().data||{});setSync("Synchronise");},()=>setSync("Erreur"));
    const u2=onSnapshot(col(db,"conges"),snap=>{
      try{setConges(snap.docs.map(d=>{const x=d.data();return{id:d.id,empId:x.empId||"",type:x.type||"Conge",debut:x.debut||"",fin:x.fin||"",note:x.note||"",statut:x.statut||"valide",demandeLe:x.demandeLe||""};}).filter(g=>g.debut&&g.fin&&g.empId));}catch(e){}
    });
    const u3=onSnapshot(doc(db,"planning","employees"),snap=>{
      if(snap.exists()&&snap.data().list&&snap.data().list.length>0){
        const fl=snap.data().list;
        setEmps(fl.map(e=>{const d=DEMP.find(x=>x.name===e.name||x.id===e.id);return{...e,hSem:e.hSem||(d&&d.hSem)||35};}));
      }
    });
    return()=>{u1();u2();u3();};
  },[fbOk,session]);

  const svC=async nc=>{
    if(!fbOk)return;
    const {db,doc,setDoc}=window.__fb;
    setSync("Sauvegarde...");
    try{await setDoc(doc(db,"planning","cells"),{data:nc});setSync("Synchronise");}catch(e){setSync("Erreur");}
  };
  const svE=async list=>{if(!fbOk)return;const {db,doc,setDoc}=window.__fb;try{await setDoc(doc(db,"planning","employees"),{list});}catch(e){}};

  const addCgA=async()=>{
    if(!cgEmp||!cgDeb||!cgFin||!fbOk)return;
    const {db,doc,setDoc}=window.__fb;
    await setDoc(doc(db,"conges","cg"+Date.now()),{empId:cgEmp,type:cgTyp,debut:cgDeb,fin:cgFin,note:cgNot,statut:"valide",demandeLe:new Date().toISOString()});
    setCgDeb("");setCgFin("");setCgNot("");setSelS(null);setSelE(null);
  };
  const demCg=async()=>{
    if(!cgDeb||!cgFin||!fbOk)return;
    const deb=new Date(cgDeb+"T12:00"),minD=new Date();minD.setMonth(minD.getMonth()+1);
    if(deb<minD){alert("Les conges doivent etre demandes au moins 1 mois a l avance. Date minimum : "+minD.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}));return;}
    const {db,doc,setDoc}=window.__fb;
    const emp=emps.find(e=>e.name===session.user);
    if(!emp)return;
    await setDoc(doc(db,"conges","cg"+Date.now()),{empId:emp.id,type:cgTyp,debut:cgDeb,fin:cgFin,note:cgNot,statut:"attente",demandeLe:new Date().toISOString()});
    setCgDeb("");setCgFin("");setCgNot("");setSelS(null);setSelE(null);
  };
  const valCg=async id=>{
    if(!fbOk)return;
    const {db,doc,setDoc}=window.__fb;
    const cg=conges.find(g=>g.id===id);if(!cg)return;
    const {id:_,...data}=cg;
    try{await setDoc(doc(db,"conges",id),{...data,statut:"valide"});}catch(e){}
  };
  const refCg=async id=>{
    if(!fbOk)return;
    const {db,doc,setDoc}=window.__fb;
    const cg=conges.find(g=>g.id===id);if(!cg)return;
    const {id:_,...data}=cg;
    try{await setDoc(doc(db,"conges",id),{...data,statut:"refuse"});}catch(e){}
  };
  const delCg=async id=>{if(!fbOk)return;const {db,doc,deleteDoc}=window.__fb;try{await deleteDoc(doc(db,"conges",id));}catch(e){}};

  const getCV=(empId,dStr)=>{
    const c=(cells[empId]||{})[dStr];if(c&&c.val)return c;
    const cg=conges.find(g=>dStr>=g.debut&&dStr<=g.fin&&g.empId===empId&&g.statut==="valide");
    if(cg)return{val:cg.type,hsupp:0,fromCg:true};
    const emp=emps.find(e=>e.id===empId);
    if(emp){
      const d=new Date(dStr+"T12:00"),jn=d.getDay();
      if(emp.name==="Mathieu"&&HM[jn])return{val:HM[jn],hsupp:0,fixed:true};
      if(emp.name==="Corentin"&&HC[jn]&&HC[jn]!=="OFF")return{val:HC[jn],hsupp:0,fixed:true};
    }
    return null;
  };

  const wkStats=(empId,wDays)=>{
    const hs=hSem(empId);let h=0,s=0,hf=0;
    wDays.forEach(d=>{
      const cv=getCV(empId,dk(d));if(!cv)return;
      const up=(cv.val||"").toUpperCase(),hh=parseH(cv.val,d.getDay());
      if(up.includes("FERIE TRAVAIL"))hf+=Math.round(hh*1.25*10)/10;
      else if(up!=="OFF"){h+=hh;if(cv.hsupp)s+=Number(cv.hsupp);}
    });
    const tot=Math.round((h+s+hf)*10)/10;
    return{h:Math.round(h*10)/10,s,hf,tot,hs,diff:Math.round((tot-hs)*10)/10};
  };

  const mStats=(empId,y,m)=>{
    const hs=hSem(empId),hj=Math.round(hs/5*10)/10;
    const d=new Date(y,m,1);
    let hT=0,hS=0,hFB=0,hFM=0,cpJ=0,rJ=0,mJ=0,fJ=0,ftJ=0,jo=0;
    while(d.getMonth()===m){
      if(!isWE(d))jo++;
      const cv=getCV(empId,dk(d));
      if(cv){
        const up=(cv.val||"").toUpperCase(),hh=parseH(cv.val,d.getDay());
        if(up.includes("FERIE TRAVAIL")){ftJ++;hFB+=hh;hFM+=Math.round(hh*1.25*10)/10;}
        else if(up==="OFF/FERIE"||up==="OFF/F\u00c9RI\u00c9"){fJ++;hT+=hj;}
        else if(up!=="OFF"){
          hT+=hh;if(cv.hsupp)hS+=Number(cv.hsupp);
          if(up.includes("CONGE")||up.includes("CONG\u00c9"))cpJ++;
          else if(up==="RTT")rJ++;
          else if(up==="MALADIE")mJ++;
        }
      }
      d.setDate(d.getDate()+1);
    }
    hT=Math.round(hT*10)/10;hFB=Math.round(hFB*10)/10;hFM=Math.round(hFM*10)/10;
    const nbS=Math.round(jo/6*10)/10,hTh=Math.round(nbS*hs*10)/10;
    const hTot=Math.round((hT+hS+hFM)*10)/10,ecart=Math.round((hTot-hTh)*10)/10;
    return{hT,hS,hFB,hFM,hTh,hTot,ecart,cpJ,rJ,mJ,fJ,ftJ,jo,hs,hj};
  };

  const openM=(empId,date,dayIdx)=>{
    const k=dk(date),c=(cells[empId]||{})[k]||{};
    // Si pas de valeur manuelle, récupérer la valeur fixe pré-remplie
    const cv=getCV(empId,k);
    const val=c.val||(cv&&cv.fixed?cv.val:"")||"";
    const up=val.toUpperCase(),isFT=up.includes("FERIE TRAVAIL");
    setMFer(isFT);
    setMAbs(isFT?"":( ABS.find(a=>up.startsWith(a.toUpperCase()))||""));
    setMLieu(isFT?"":( LIEUX.find(l=>up.startsWith(l.toUpperCase()))||""));
    const mt=val.match(/(\d{1,2})[hH](\d{2})\s*[\/\-]\s*(\d{1,2})[hH](\d{2})/i);
    setMDeb(mt?mt[1]+"h"+mt[2]:"");setMFin(mt?mt[3]+"h"+mt[4]:"");
    setMHS(c.hsupp||0);setModal({empId,date,k,dayIdx});

  const svM=async()=>{

          React.createElement("input",{type:"number",min:0,max:12,step:0.5,value:mHS,onChange:e=>setMHS(e.target.value),style:{width:75,border:"1.5px solid #e5e7eb",borderRadius:8,padding:"8px 10px",fontSize:14,textAlign:"center",background:"#f8f9fa"}}),
          React.createElement("span",{style:{color:"#888",fontSize:12}},"h supp ce jour")
        ),
        React.createElement("div",{style:{display:"flex",gap:7}},
          React.createElement("button",{onClick:svM,style:{flex:1,padding:"11px 0",borderRadius:9,border:"none",background:"#1a6ed8",color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}},"Enregistrer"),
          React.createElement("button",{onClick:clM,style:{padding:"11px 12px",borderRadius:9,border:"1px solid #fca5a5",background:"#fde8e8",color:"#dc2626",fontWeight:700,fontSize:13,cursor:"pointer"}},"Effacer"),
          React.createElement("button",{onClick:()=>setModal(null),style:{padding:"11px 12px",borderRadius:9,border:"1px solid #e5e7eb",background:"#f8f9fa",color:"#888",fontWeight:600,fontSize:13,cursor:"pointer"}},"Annuler")
        )
      )
    );
  };

  if(!sesOk)return null;
  if(!session)return React.createElement(Login,{onLogin:s=>setSession(s)});

  return React.createElement("div",{style:{minHeight:"100vh",background:"#f5f6f8",fontFamily:"'Segoe UI',Arial,sans-serif"}},
    React.createElement("div",{style:{background:"#fff",borderBottom:"1px solid #e5e7eb",padding:mob?"8px 12px":"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,boxShadow:"0 1px 3px rgba(0,0,0,0.05)",position:"sticky",top:0,zIndex:10}},
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8}},
        React.createElement("div",{style:{width:32,height:32,background:"linear-gradient(135deg,#1a6ed8,#8b1ad6)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}},"📅"),
        !mob&&React.createElement("div",null,
          React.createElement("div",{style:{fontSize:14,fontWeight:800,color:"#1a1a2e",lineHeight:1}},"Planning Equipe"),
          React.createElement("div",{style:{fontSize:9,color:sync.includes("Synchro")?"#059669":sync.includes("Err")?"#dc2626":"#d97706",fontWeight:600}},sync)
        )
      ),
      React.createElement("div",{style:{display:"flex",gap:mob?4:5,flexWrap:"nowrap"}},
        NB("planning",mob?"📅":"📅 Planning"),
        NB("conges",mob?"🏖️":"🏖️ Conges"),
        NB("recap",mob?"📊":"📊 Compte rendu"),
        isA&&NB("equipe",mob?"👥":"👥 Equipe")
      ),
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:6}},
        !mob&&React.createElement("div",{style:{textAlign:"right",lineHeight:1.3}},
          React.createElement("div",{style:{fontSize:12,fontWeight:700,color:"#1a1a2e"}},session.user),
          React.createElement("div",{style:{fontSize:10,color:isA?"#8b1ad6":"#1a6ed8",fontWeight:600}},isA?"Admin":"Lecteur")
        ),
        React.createElement("button",{onClick:()=>{clS();setSession(null);},style:{padding:"6px 10px",borderRadius:7,border:"1px solid #e5e7eb",background:"#f8f9fa",color:"#888",fontWeight:600,fontSize:11,cursor:"pointer"}},mob?"↩":"Deconnexion")
      )
    ),
    !isA&&React.createElement("div",{style:{background:"#fffbeb",borderBottom:"1px solid #fde68a",padding:"6px 16px",fontSize:11,color:"#d97706",fontWeight:600}},"Mode consultation - Seule Laetitia peut modifier le planning."),
    React.createElement("div",{style:{padding:mob?"10px":16,maxWidth:1400,margin:"0 auto"}},
      view==="planning"&&renderPlanning(),
      view==="conges"&&renderConges(),
      view==="recap"&&renderRecap(),
      view==="equipe"&&renderEquipe()
    ),
    isA&&renderModal()
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
