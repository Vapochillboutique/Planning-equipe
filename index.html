<script type="text/babel">

// ── Constantes ────────────────────────────────────────────────────────────────
const JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const H_STD = 7, H_SEM = 35;
const LIEUX   = ["Bureau","Château","T-C","Tours N","Réunion","Formation"];
const ABSENCES = ["OFF","Congé","RTT","Maladie","OFF/Férié","Absence"];
const TYPES_CG = ["Congé","RTT","Maladie","OFF/Férié","Absence"];
const CG_COLORS = {"Congé":"#10b981","RTT":"#6366f1","Maladie":"#ef4444","OFF/Férié":"#f59e0b","Absence":"#94a3b8"};

const EMP_STYLES = [
  {accent:"#d63384",light:"#fdf0f8"},{accent:"#1a6ed8",light:"#f0f5fe"},
  {accent:"#d6530a",light:"#fdf5f0"},{accent:"#1ab86b",light:"#f0fef5"},
  {accent:"#8b1ad6",light:"#f8f0fe"},{accent:"#b8a81a",light:"#fefdf0"},
  {accent:"#1ab0d6",light:"#f0fcfe"},{accent:"#d61a1a",light:"#fef0f0"},
];
const empStyle = i => EMP_STYLES[i % EMP_STYLES.length];

const DEFAULT_EMP = [
  {id:"e1",name:"Laetitia"},{id:"e2",name:"Nicolas"},{id:"e3",name:"Charlotte"},
  {id:"e4",name:"Marco"},{id:"e5",name:"Alan"},{id:"e6",name:"Corentin"},
];

const USERS = [
  {user:"Laetitia",pass:"Boutique2014!",role:"admin"},
  {user:"Nicolas",  pass:"12345",role:"lecteur"},
  {user:"Charlotte",pass:"12345",role:"lecteur"},
  {user:"Marco",    pass:"12345",role:"lecteur"},
  {user:"Alan",     pass:"12345",role:"lecteur"},
  {user:"Corentin", pass:"12345",role:"lecteur"},
];

// ── Créneaux horaires 10h00→19h30 par 15min ───────────────────────────────────
const TIME_SLOTS = [];
for(let h=10;h<=19;h++){const mx=(h===19)?30:45;for(let m=0;m<=mx;m+=15)TIME_SLOTS.push(`${String(h).padStart(2,'0')}h${m===0?'00':m}`);}

// ── Utilitaires ───────────────────────────────────────────────────────────────
const pad = n => String(n).padStart(2,'0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const getMondayOf = d => { const r=new Date(d); const day=r.getDay(); r.setDate(r.getDate()+(day===0?-6:1-day)); r.setHours(0,0,0,0); return r; };
const addDays = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
const frDate = d => d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
const frDateStr = s => new Date(s+'T12:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
const frMonthLabel = (y,m) => new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const getWeekDays = mon => Array.from({length:7},(_,i)=>addDays(mon,i));
const isWE = d => d.getDay()===0||d.getDay()===6;

const parseHeures = tranche => {
  if(!tranche) return 0;
  const s=tranche.trim().toUpperCase();
  if(["OFF","OFF/FÉRIÉ","OFF/FERIE","CONGE","CONGÉ","RTT","MALADIE","ABSENCE"].some(x=>s===x||s.startsWith(x))) return 0;
  const re=/(\d{1,2})[h:]?(\d{0,2})\s*[\/\-]\s*(\d{1,2})[h:]?(\d{0,2})/;
  const m=s.match(re); if(!m) return 0;
  const debut=parseInt(m[1])*60+(m[2]?parseInt(m[2]||0):0);
  const fin=parseInt(m[3])*60+(m[4]?parseInt(m[4]||0):0);
  const diff=fin-debut; if(diff<=0) return 0;
  return (diff>360?diff-60:diff)/60;
};

const isAbsence = val => { if(!val)return false; const v=val.trim().toUpperCase(); return ["OFF","OFF/FÉRIÉ","OFF/FERIE","CONGE","CONGÉ","RTT","MALADIE","ABSENCE"].some(x=>v===x||v.startsWith(x)); };

const getCellBg = (val,es) => {
  if(!val) return '#fff';
  const v=val.trim().toUpperCase();
  if(v==="OFF") return '#f8f8f8';
  if(v.includes("FÉRIÉ")||v.includes("FERIE")) return '#fff3cd';
  if(v.includes("CONGÉ")||v.includes("CONGE")) return '#d4edda';
  if(v==="RTT") return '#cce5ff';
  if(v==="MALADIE") return '#f8d7da';
  if(v.includes("T-C")) return '#e2d9f3';
  if(v.includes("TOURS N")) return '#e8f5e9';
  if(v.includes("CHÂTEAU")||v.includes("CHATEAU")) return '#fff3cd';
  if(v.includes("FORMATION")) return '#d4edda';
  return es.light;
};
const getCellTxt = val => {
  if(!val) return '#aaa';
  const v=val.trim().toUpperCase();
  if(v==="OFF") return '#999';
  if(v.includes("FÉRIÉ")||v.includes("FERIE")) return '#856404';
  if(v.includes("CONGÉ")||v.includes("CONGE")) return '#155724';
  if(v==="RTT") return '#004085';
  if(v==="MALADIE") return '#721c24';
  if(v.includes("T-C")) return '#4a1d96';
  if(v.includes("TOURS N")) return '#2e7d32';
  if(v.includes("CHÂTEAU")||v.includes("CHATEAU")) return '#7c5200';
  return '#333';
};

const getMonthWeeks = (year,month) => {
  const weeks=[], lastDay=new Date(year,month+1,0);
  let mon=getMondayOf(new Date(year,month,1));
  while(mon<=lastDay){
    const wDays=getWeekDays(mon).filter(d=>d.getMonth()===month&&!isWE(d));
    if(wDays.length>0) weeks.push({mon:new Date(mon),wDays});
    mon=addDays(mon,7);
  }
  return weeks;
};

const jouvresRange = (debut,fin) => {
  let d=new Date(debut),count=0; const end=new Date(fin);
  while(d<=end){if(!isWE(d))count++;d.setDate(d.getDate()+1);}
  return count;
};

// ── Session locale ────────────────────────────────────────────────────────────
const SK_SESSION = "planningSession";
const saveSession = s => { try{localStorage.setItem(SK_SESSION,JSON.stringify(s));}catch{} };
const loadSession = () => { try{const v=localStorage.getItem(SK_SESSION);if(v)return JSON.parse(v);}catch{} return null; };
const clearSession = () => { try{localStorage.removeItem(SK_SESSION);}catch{} };

// ── Écran Login ───────────────────────────────────────────────────────────────
function Login({onLogin}) {
  const [user,setUser]=React.useState(""); const [pass,setPass]=React.useState("");
  const [err,setErr]=React.useState(""); const [showP,setShowP]=React.useState(false);
  const handle = () => {
    const found=USERS.find(u=>u.user.toLowerCase()===user.trim().toLowerCase()&&u.pass===pass.trim());
    if(found){saveSession({user:found.user,role:found.role});onLogin({user:found.user,role:found.role});}
    else{setErr("Identifiant ou mot de passe incorrect.");setTimeout(()=>setErr(""),3000);}
  };
  return (
    <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Segoe UI',sans-serif"}}>
      <div style={{background:'#fff',borderRadius:20,padding:40,width:380,maxWidth:'calc(100vw - 32px)',boxShadow:'0 30px 80px #0005'}}>
        <div style={{textAlign:'center',marginBottom:32}}>
          <div style={{width:60,height:60,background:'linear-gradient(135deg,#1a6ed8,#8b1ad6)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,margin:'0 auto 14px'}}>📅</div>
          <div style={{fontSize:22,fontWeight:800,color:'#1a1a2e'}}>Planning Équipe</div>
          <div style={{fontSize:12,color:'#aaa',marginTop:4}}>Connectez-vous pour accéder au planning</div>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{display:'block',fontSize:11,color:'#888',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:6}}>Identifiant</label>
          <input value={user} onChange={e=>setUser(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handle()} placeholder="Votre prénom" autoFocus
            style={{width:'100%',border:'1.5px solid #e5e7eb',borderRadius:10,padding:'11px 14px',fontSize:14,color:'#1a1a2e',background:'#f8f9fa',boxSizing:'border-box'}}/>
        </div>
        <div style={{marginBottom:20}}>
          <label style={{display:'block',fontSize:11,color:'#888',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:6}}>Mot de passe</label>
          <div style={{position:'relative'}}>
            <input type={showP?'text':'password'} value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handle()} placeholder="••••••••"
              style={{width:'100%',border:'1.5px solid #e5e7eb',borderRadius:10,padding:'11px 40px 11px 14px',fontSize:14,color:'#1a1a2e',background:'#f8f9fa',boxSizing:'border-box'}}/>
            <button onClick={()=>setShowP(p=>!p)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:16,color:'#aaa'}}>{showP?'🙈':'👁️'}</button>
          </div>
        </div>
        {err&&<div style={{background:'#fce8e8',border:'1px solid #f8d7da',borderRadius:8,padding:'10px 14px',color:'#d63384',fontSize:13,fontWeight:600,marginBottom:16,textAlign:'center'}}>⚠️ {err}</div>}
        <button onClick={handle} style={{width:'100%',padding:'13px 0',borderRadius:10,border:'none',background:'linear-gradient(135deg,#1a6ed8,#8b1ad6)',color:'#fff',fontWeight:800,fontSize:15,cursor:'pointer'}}>Se connecter →</button>
        <div style={{textAlign:'center',marginTop:20,fontSize:11,color:'#ccc'}}>🔒 Accès sécurisé · Planning Équipe</div>
      </div>
    </div>
  );
}

// ── App principale ────────────────────────────────────────────────────────────
function App() {
  const today = new Date();

  // Auth
  const [session,    setSession]    = React.useState(null);
  const [sesLoaded,  setSesLoaded]  = React.useState(false);
  // Firebase
  const [fbReady,    setFbReady]    = React.useState(false);
  // Données (sync Firebase)
  const [employees,  setEmployees]  = React.useState(DEFAULT_EMP);
  const [cells,      setCells]      = React.useState({});
  const [conges,     setConges]     = React.useState([]);
  // Navigation
  const [view,       setView]       = React.useState("calendrier");
  const [monday,     setMonday]     = React.useState(getMondayOf(today));
  const [calMonth,   setCalMonth]   = React.useState(today.getMonth());
  const [calYear,    setCalYear]    = React.useState(today.getFullYear());
  const [cgMonth,    setCgMonth]    = React.useState(today.getMonth());
  const [cgYear,     setCgYear]     = React.useState(today.getFullYear());
  const [recapMonth, setRecapMonth] = React.useState(today.getMonth());
  const [recapYear,  setRecapYear]  = React.useState(today.getFullYear());
  // Modal planning
  const [modal,      setModal]      = React.useState(null);
  const [mLieu,      setMLieu]      = React.useState("");
  const [mAbsence,   setMAbsence]   = React.useState("");
  const [mDebut,     setMDebut]     = React.useState("");
  const [mFin,       setMFin]       = React.useState("");
  const [mHS,        setMHS]        = React.useState(0);
  // Congés form
  const [cgEmpId,    setCgEmpId]    = React.useState("");
  const [cgType,     setCgType]     = React.useState("Congé");
  const [cgDebut,    setCgDebut]    = React.useState("");
  const [cgFin,      setCgFin]      = React.useState("");
  const [cgNote,     setCgNote]     = React.useState("");
  const [selStart,   setSelStart]   = React.useState(null);
  const [selEnd,     setSelEnd]     = React.useState(null);
  const [hovDay,     setHovDay]     = React.useState(null);
  // Equipe
  const [newName,    setNewName]    = React.useState("");
  // Sync status
  const [syncStatus, setSyncStatus] = React.useState("⏳ Connexion...");

  const isAdmin = session?.role === "admin";

  // ── Charger session locale ──
  React.useEffect(() => {
    const s = loadSession(); if(s) setSession(s); setSesLoaded(true);
  }, []);

  // ── Attendre Firebase ──
  React.useEffect(() => {
    if(window.__firebaseReady) { setFbReady(true); return; }
    const h = () => setFbReady(true);
    window.addEventListener('firebaseReady', h);
    return () => window.removeEventListener('firebaseReady', h);
  }, []);

  // ── Écoute temps réel Firebase ──
  React.useEffect(() => {
    if(!fbReady || !session) return;
    const {db, onSnapshot, collection, doc} = window.__firebase;

    // Cells
    const unsubCells = onSnapshot(doc(db,'planning','cells'), snap => {
      if(snap.exists()) { setCells(snap.data().data||{}); setSyncStatus("✅ Synchronisé"); }
    }, ()=>setSyncStatus("❌ Erreur sync"));

    // Congés
    const unsubConges = onSnapshot(collection(db,'conges'), snap => {
      const list = snap.docs.map(d=>({id:d.id,...d.data()}));
      setConges(list); setSyncStatus("✅ Synchronisé");
    });

    // Employés
    const unsubEmp = onSnapshot(doc(db,'planning','employees'), snap => {
      if(snap.exists()&&snap.data().list?.length>0) setEmployees(snap.data().list);
    });

    return () => { unsubCells(); unsubConges(); unsubEmp(); };
  }, [fbReady, session]);

  // ── Sauvegarder cells ──
  const saveCells = async (newCells) => {
    if(!fbReady) return;
    const {db, doc, setDoc} = window.__firebase;
    setSyncStatus("💾 Sauvegarde...");
    try { await setDoc(doc(db,'planning','cells'),{data:newCells}); setSyncStatus("✅ Synchronisé"); }
    catch(e) { setSyncStatus("❌ Erreur sauvegarde"); }
  };

  // ── Sauvegarder employees ──
  const saveEmployees = async (list) => {
    if(!fbReady) return;
    const {db, doc, setDoc} = window.__firebase;
    try { await setDoc(doc(db,'planning','employees'),{list}); } catch{}
  };

  // ── Ajouter congé ──
  const addConge = async () => {
    if(!cgEmpId||!cgDebut||!cgFin||!fbReady) return;
    const {db, doc, setDoc} = window.__firebase;
    const id = 'cg'+Date.now();
    const cg = {empId:cgEmpId, type:cgType, debut:cgDebut, fin:cgFin, note:cgNote};
    try { await setDoc(doc(db,'conges',id), cg); } catch{}
    setCgDebut(''); setCgFin(''); setCgNote(''); setSelStart(null); setSelEnd(null);
  };

  // ── Supprimer congé ──
  const delConge = async (id) => {
    if(!fbReady) return;
    const {db, doc, deleteDoc} = window.__firebase;
    try { await deleteDoc(doc(db,'conges',id)); } catch{}
  };

  // ── Modal planning ──
  const openModal = (empId, date, dayIdx) => {
    const k=dk(date), c=(cells[empId]||{})[k]||{};
    const val=c.val||'';
    const absFound=ABSENCES.find(a=>val.toUpperCase().startsWith(a.toUpperCase()));
    const lieuFound=LIEUX.find(l=>val.toUpperCase().startsWith(l.toUpperCase()));
    const m=val.match(/(\d{1,2}h\d{0,2})\s*\/\s*(\d{1,2}h\d{0,2})/i);
    setMAbsence(absFound||""); setMLieu(lieuFound||"");
    setMDebut(m?m[1]:""); setMFin(m?m[2]:""); setMHS(c.hsupp||0);
    setModal({empId,date,k,dayIdx});
  };

  const saveModal = async () => {
    if(!modal) return;
    const {empId,k}=modal;
    let val="";
    if(mAbsence) val=mAbsence;
    else if(mDebut&&mFin) val=mLieu?`${mLieu} ${mDebut}/${mFin}`:`${mDebut}/${mFin}`;
    else if(mLieu) val=mLieu;
    const newCells={...cells,[empId]:{...(cells[empId]||{})}};
    if(val||Number(mHS)>0) newCells[empId][k]={val,hsupp:Number(mHS)||0};
    else delete newCells[empId][k];
    setCells(newCells); await saveCells(newCells); setModal(null);
  };

  const clearModal = async () => {
    if(!modal) return;
    const {empId,k}=modal;
    const newCells={...cells,[empId]:{...(cells[empId]||{})}};
    delete newCells[empId][k];
    setCells(newCells); await saveCells(newCells);
    setMLieu(''); setMAbsence(''); setMDebut(''); setMFin(''); setMHS(0); setModal(null);
  };

  // ── Stats ──
  const getWeekStats = (empId,wDays) => {
    const ec=cells[empId]||{}; let total=0,hsupp=0;
    wDays.forEach(d=>{const c=ec[dk(d)];if(!c)return;total+=parseHeures(c.val);if(c.hsupp)hsupp+=Number(c.hsupp);});
    return {total:Math.round(total*10)/10, hsupp, diff:Math.round((total+hsupp-H_SEM)*10)/10};
  };

  const getMonthStats = (empId,year,month) => {
    const ec=cells[empId]||{};
    const d=new Date(year,month,1);
    let hTrav=0,hSupp=0,cpJ=0,rttJ=0,malJ=0,ferieJ=0,jouvres=0;
    while(d.getMonth()===month){
      if(!isWE(d)) jouvres++;
      const c=ec[dk(d)];
      if(c){
        const v=(c.val||'').trim().toUpperCase(), h=parseHeures(c.val);
        hTrav+=h; if(c.hsupp)hSupp+=Number(c.hsupp);
        if(v.includes("CONGÉ")||v.includes("CONGE")) cpJ++;
        else if(v==="RTT") rttJ++;
        else if(v==="MALADIE") malJ++;
        else if(v.includes("FÉRIÉ")||v.includes("FERIE")) ferieJ++;
      }
      // Compter congés Firebase sur ce jour
      const dStr=dk(d);
      conges.forEach(cg=>{
        if(dStr>=cg.debut&&dStr<=cg.fin&&!isWE(d)&&cg.empId===empId){
          if(cg.type==="Congé"&&!ec[dStr]) cpJ++;
          else if(cg.type==="RTT"&&!ec[dStr]) rttJ++;
        }
      });
      d.setDate(d.getDate()+1);
    }
    const hTheo=jouvres*H_STD, hTotales=hTrav+hSupp, ecart=Math.round((hTotales-hTheo)*10)/10;
    return {hTrav:Math.round(hTrav*10)/10,hSupp,hTheo,hTotales:Math.round(hTotales*10)/10,ecart,cpJ,rttJ,malJ,ferieJ,jouvres};
  };

  // ── Congés d'un jour (pour affichage dans calendrier) ──
  const getCongesJour = (dStr) => conges.filter(cg=>dStr>=cg.debut&&dStr<=cg.fin);

  // ── Valeur cellule avec congé ──
  const getCellVal = (empId, dStr) => {
    const c = (cells[empId]||{})[dStr];
    if(c?.val) return c;
    // Chercher un congé Firebase
    const cg = conges.find(cg=>dStr>=cg.debut&&dStr<=cg.fin&&cg.empId===empId);
    if(cg) return {val:cg.type, hsupp:0, fromCg:true};
    return null;
  };

  // ── Styles communs ──
  const th = {padding:'10px 12px',background:'#fff',color:'#555',fontWeight:700,fontSize:12,textAlign:'center',borderBottom:'2px solid #eee'};
  const td = {padding:'7px 10px',fontSize:12,color:'#444',verticalAlign:'middle'};
  const btnS = {padding:'7px 14px',borderRadius:8,border:'1px solid #ddd',background:'#fff',color:'#555',fontWeight:600,cursor:'pointer',fontSize:13};
  const lbl = {display:'block',fontSize:11,color:'#888',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.4px',marginBottom:6};
  const inpS = {width:'100%',border:'1.5px solid #e5e7eb',borderRadius:9,padding:'9px 12px',fontSize:13,color:'#1a1a2e',background:'#f8f9fa',boxSizing:'border-box'};
  const navBtn = (v,lbl) => (
    <button onClick={()=>setView(v)} style={{padding:'8px 16px',borderRadius:8,cursor:'pointer',fontSize:13,fontWeight:700,
      background:view===v?'#1a6ed8':'#fff',color:view===v?'#fff':'#555',
      border:view===v?'1px solid #1a6ed8':'1px solid #e5e7eb',whiteSpace:'nowrap'}}>{lbl}</button>
  );

  // ── CALENDRIER ──────────────────────────────────────────────────────────────
  const renderCalendrier = () => {
    const firstDay=new Date(calYear,calMonth,1), lastDay=new Date(calYear,calMonth+1,0);
    const allDays=[], d=new Date(firstDay);
    while(d<=lastDay){allDays.push(new Date(d));d.setDate(d.getDate()+1);}
    const workDays=allDays.filter(d=>!isWE(d));
    const weeks=[]; let mon=getMondayOf(firstDay);
    while(mon<=lastDay){weeks.push(getWeekDays(mon));mon=addDays(mon,7);}

  // ── CONGÉS ──────────────────────────────────────────────────────────────────
  const renderConges = () => {

    const clickDay = day => {
      if(!isAdmin) return;
      const dStr=`${cgYear}-${pad(cgMonth+1)}-${pad(day)}`;

      else{
        const lo=dStr<selStart?dStr:selStart, hi=dStr<selStart?selStart:dStr;

      const dStr=`${cgYear}-${pad(cgMonth+1)}-${pad(day)}`;
      if(selStart&&selEnd) return dStr>=selStart&&dStr<=selEnd;

                    <div style={{flex:1}}>
                      <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:2}}>
                        <span style={{fontWeight:700,fontSize:12,color:es.accent}}>● {emp?.name||'?'}</span>

                const rttJ=myCgs.filter(c=>c.type==="RTT").reduce((s,c)=>s+jouvresRange(new Date(c.debut+'T12:00'),new Date(c.fin+'T12:00')),0);
                const tot=myCgs.reduce((s,c)=>s+jouvresRange(new Date(c.debut+'T12:00'),new Date(c.fin+'T12:00')),0);
                return <div key={emp.id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:8,marginBottom:5,background:'#f8f9fa',borderLeft:`4px solid ${es.accent}`}}>
                  <span style={{fontWeight:700,fontSize:12,color:es.accent,minWidth:75}}>{emp.name}</span>
                  <span style={{fontSize:11,color:'#10b981',fontWeight:700}}>{cpJ}j CP</span>
                  <span style={{fontSize:11,color:'#6366f1',fontWeight:700}}>{rttJ}j RTT</span>
                  <span style={{fontSize:11,color:'#555',fontWeight:600,marginLeft:'auto'}}>{tot}j total</span>
                </div>;
              })}
            </div>
          </div>
        </div>
      </div>
    );
  };

  // ── RECAP ───────────────────────────────────────────────────────────────────
  const renderRecap = () => {
    const weeks=getMonthWeeks(recapYear,recapMonth);
    const navR=dir=>{let m=recapMonth+dir,y=recapYear;if(m<0){m=11;y--;}if(m>11){m=0;y++;}setRecapMonth(m);setRecapYear(y);};
    return (
      <div>
        <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:20,flexWrap:'wrap'}}>
          <h2 style={{fontSize:22,fontWeight:800,color:'#1a1a2e'}}>Compte rendu mensuel</h2>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <button onClick={()=>navR(-1)} style={btnS}>‹</button>
            <span style={{fontSize:16,fontWeight:700,textTransform:'capitalize',minWidth:160,textAlign:'center'}}>{frMonthLabel(recapYear,recapMonth)}</span>
            <button onClick={()=>navR(1)} style={btnS}>›</button>
          </div>
        </div>
        {employees.map((emp,ei)=>{
          const es=empStyle(ei), s=getMonthStats(emp.id,recapYear,recapMonth);
          const weekRows=weeks.map(({mon,wDays})=>{
            let wH=0,wHS=0;
            wDays.forEach(d=>{const cv=getCellVal(emp.id,dk(d));if(cv){wH+=parseHeures(cv.val);if(cv.hsupp)wHS+=Number(cv.hsupp);}});
            const theorique=wDays.length*H_STD, total=Math.round((wH+wHS)*10)/10, diff=Math.round((total-H_SEM)*10)/10;
            return {mon,wDays,wH:Math.round(wH*10)/10,wHS,theorique,total,diff};
          });
          return <div key={emp.id} style={{background:'#fff',borderRadius:12,padding:20,marginBottom:16,boxShadow:'0 2px 12px #0001',border:'1px solid #e5e7eb',borderLeft:`5px solid ${es.accent}`}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
              <span style={{color:es.accent,fontSize:16}}>●</span>
              <span style={{fontSize:16,fontWeight:800}}>{emp.name}</span>
              <span style={{fontSize:12,color:'#999'}}>{s.jouvres} jours ouvrés · {s.hTheo}h théoriques</span>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(110px,1fr))',gap:10,marginBottom:16}}>
              {[{l:'H.travaillées',v:s.hTrav,u:'h',c:'#1a6ed8'},{l:'H.supp.',v:s.hSupp,u:'h',c:'#f57c00'},{l:'Total H.',v:s.hTotales,u:'h',c:s.ecart>=0?'#1ab86b':'#d63384'},{l:'Écart',v:s.ecart,u:'h',c:s.ecart>=0?'#1ab86b':'#d63384',p:s.ecart>0?'+':''},{l:'Congés CP',v:s.cpJ,u:'j',c:'#155724'},{l:'RTT',v:s.rttJ,u:'j',c:'#004085'},{l:'Maladie',v:s.malJ,u:'j',c:'#721c24'},{l:'Férié',v:s.ferieJ,u:'j',c:'#856404'}]
                .map(({l,v,u,c,p=''})=><div key={l} style={{background:c+'11',border:`1px solid ${c}33`,borderRadius:8,padding:'9px 11px'}}>
                  <div style={{fontSize:10,color:'#888',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.4px',marginBottom:3}}>{l}</div>
                  <div style={{fontSize:18,fontWeight:800,color:c}}>{p}{v}<span style={{fontSize:10,color:'#aaa',marginLeft:2}}>{u}</span></div>
                </div>)}
            </div>
            <div style={{overflowX:'auto'}}>
              <table style={{borderCollapse:'collapse',width:'100%'}}>
                <thead><tr>{['Semaine','J.ouvrés','H.théo.','H.trav.','H.supp.','Total','Écart 35h'].map(h=><th key={h} style={{padding:'6px 8px',background:'#f8f9fa',color:'#888',fontSize:11,fontWeight:600,textAlign:'left',borderBottom:'1px solid #eee'}}>{h}</th>)}</tr></thead>
                <tbody>{weekRows.map(({mon,wDays,wH,wHS,theorique,total,diff},wi)=><tr key={wi}>
                  <td style={td}>{frDate(mon)}–{frDate(addDays(mon,4))}</td>
                  <td style={td}>{wDays.length}j</td><td style={td}>{theorique}h</td>
                  <td style={td}>{wH}h</td>
                  <td style={{...td,color:wHS>0?'#f57c00':'#ccc',fontWeight:wHS>0?700:400}}>{wHS>0?`+${wHS}h`:'—'}</td>
                  <td style={{...td,fontWeight:700}}>{total}h</td>
                  <td style={td}><span style={{background:diff>0?'#fff8e1':diff<0?'#fce8e8':'#e8fcf0',color:diff>0?'#f57c00':diff<0?'#d63384':'#1ab86b',borderRadius:20,padding:'2px 7px',fontSize:11,fontWeight:700}}>{diff>0?`+${diff}h`:diff<0?`${diff}h`:'✓'}</span></td>
                </tr>)}</tbody>
                <tfoot><tr>
                  <td colSpan={5} style={{...td,fontWeight:700,color:'#555',paddingTop:10}}>Total du mois :</td>
                  <td style={{...td,fontWeight:800,fontSize:15,color:s.hTotales>=s.hTheo?'#1ab86b':'#d63384',paddingTop:10}}>{s.hTotales}h</td>
                  <td style={{...td,paddingTop:10}}><span style={{background:s.ecart>=0?'#e8fcf0':'#fce8e8',color:s.ecart>=0?'#1ab86b':'#d63384',borderRadius:20,padding:'3px 10px',fontSize:12,fontWeight:800}}>{s.ecart>0?`+${s.ecart}h`:s.ecart<0?`${s.ecart}h`:'Parfait ✓'}</span></td>
                </tr></tfoot>
              </table>
            </div>
          </div>;
        })}
        <div style={{background:'#1a1a2e',borderRadius:12,padding:20,border:'1px solid #333',color:'#eee'}}>
          <div style={{fontSize:15,fontWeight:800,marginBottom:14,color:'#fff'}}>📊 Synthèse équipe — <span style={{textTransform:'capitalize'}}>{frMonthLabel(recapYear,recapMonth)}</span></div>
          <table style={{borderCollapse:'collapse',width:'100%'}}>
            <thead><tr>{['Employé','H.trav.','H.supp.','Total','Écart','CP','RTT','Maladie'].map(h=><th key={h} style={{padding:'7px 10px',background:'#252540',color:'#888',fontSize:11,fontWeight:600,textAlign:'left',borderBottom:'1px solid #333'}}>{h}</th>)}</tr></thead>
            <tbody>{employees.map((emp,ei)=>{
              const es=empStyle(ei), s=getMonthStats(emp.id,recapYear,recapMonth);
              return <tr key={emp.id}>
                <td style={{...td,color:'#fff',fontWeight:700,borderBottom:'1px solid #333'}}><span style={{color:es.accent}}>●</span> {emp.name}</td>
                <td style={{...td,color:'#aaa',borderBottom:'1px solid #333'}}>{s.hTrav}h</td>
                <td style={{...td,color:s.hSupp>0?'#f57c00':'#555',fontWeight:s.hSupp>0?700:400,borderBottom:'1px solid #333'}}>{s.hSupp>0?`+${s.hSupp}h`:'—'}</td>
                <td style={{...td,color:'#fff',fontWeight:800,borderBottom:'1px solid #333'}}>{s.hTotales}h</td>
                <td style={{...td,borderBottom:'1px solid #333'}}><span style={{background:s.ecart>=0?'#1ab86b22':'#d6338422',color:s.ecart>=0?'#1ab86b':'#d63384',borderRadius:20,padding:'2px 7px',fontSize:11,fontWeight:700}}>{s.ecart>0?`+${s.ecart}h`:s.ecart<0?`${s.ecart}h`:'✓'}</span></td>
                <td style={{...td,color:s.cpJ>0?'#1ab86b':'#555',borderBottom:'1px solid #333'}}>{s.cpJ>0?`${s.cpJ}j`:'—'}</td>
                <td style={{...td,color:s.rttJ>0?'#1a6ed8':'#555',borderBottom:'1px solid #333'}}>{s.rttJ>0?`${s.rttJ}j`:'—'}</td>
                <td style={{...td,color:s.malJ>0?'#d63384':'#555',borderBottom:'1px solid #333'}}>{s.malJ>0?`${s.malJ}j`:'—'}</td>
              </tr>;
            })}</tbody>
          </table>
        </div>
      </div>
    );
  };

  // ── EQUIPE ──────────────────────────────────────────────────────────────────
  const renderEquipe = () => (
    <div style={{maxWidth:500}}>
      <h2 style={{fontSize:22,fontWeight:800,color:'#1a1a2e',marginBottom:20}}>Gestion de l'équipe</h2>
      {employees.map((emp,ei)=>{
        const es=empStyle(ei);
        return <div key={emp.id} style={{display:'flex',alignItems:'center',gap:10,padding:'11px 16px',background:'#fff',borderRadius:10,marginBottom:8,border:'1px solid #e5e7eb',borderLeft:`4px solid ${es.accent}`}}>
          <span style={{color:es.accent}}>●</span>
          <span style={{flex:1,fontWeight:600}}>{emp.name}</span>
          <button onClick={()=>{const l=employees.filter(e=>e.id!==emp.id);setEmployees(l);saveEmployees(l);}} style={{background:'none',border:'none',color:'#d63384',cursor:'pointer',fontSize:16}}>✕</button>
        </div>;
      })}
      <div style={{background:'#fff',borderRadius:12,padding:20,marginTop:20,border:'1px solid #e5e7eb'}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>Ajouter un employé</div>
        <label style={lbl}>Nom</label>
        <input value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addEmp()} placeholder="Prénom Nom" style={{...inpS,marginBottom:12}}/>
        <button onClick={addEmp} style={{width:'100%',padding:'10px 0',borderRadius:8,border:'none',background:'#1a6ed8',color:'#fff',fontWeight:700,fontSize:14,cursor:'pointer'}}>+ Ajouter</button>
      </div>
    </div>
  );
  const addEmp = () => {
    if(!newName.trim()) return;
    const l=[...employees,{id:'e'+Date.now(),name:newName.trim()}];
    setEmployees(l); saveEmployees(l); setNewName('');
  };

  // ── MODAL ───────────────────────────────────────────────────────────────────
  const renderModal = () => {
    if(!modal) return null;
    const emp=employees.find(e=>e.id===modal.empId), es=empStyle(employees.findIndex(e=>e.id===modal.empId));
    const toMin=t=>{const[h,m]=t.replace('h',':').split(':');return parseInt(h)*60+(parseInt(m)||0);};
    const duree=mDebut&&mFin?Math.round(Math.max(0,(toMin(mFin)-toMin(mDebut)>360?toMin(mFin)-toMin(mDebut)-60:toMin(mFin)-toMin(mDebut)))/60*10)/10:null;
    const selS={flex:1,border:'1.5px solid #e5e7eb',borderRadius:9,padding:'8px 7px',fontSize:13,color:'#1a1a2e',background:'#f8f9fa'};
    return (
      <div onClick={e=>e.target===e.currentTarget&&setModal(null)} style={{position:'fixed',inset:0,background:'#00000055',display:'flex',alignItems:'center',justifyContent:'center',zIndex:100,backdropFilter:'blur(3px)'}}>
        <div style={{background:'#fff',borderRadius:16,padding:28,width:420,maxWidth:'calc(100vw - 32px)',boxShadow:'0 20px 60px #0003',border:'1px solid #e5e7eb'}}>
          <div style={{fontSize:15,fontWeight:800,marginBottom:2}}><span style={{color:es.accent}}>●</span> {emp?.name}</div>
          <div style={{fontSize:12,color:'#888',marginBottom:18}}>{JOURS[modal.dayIdx]} {frDate(modal.date)}</div>
          <label style={lbl}>Lieu de travail</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:14}}>
            {LIEUX.map(l=><button key={l} onClick={()=>{setMLieu(l===mLieu?'':l);setMAbsence('');}}
              style={{padding:'5px 11px',borderRadius:20,border:`1.5px solid ${mLieu===l?'#1a6ed8':'#e5e7eb'}`,background:mLieu===l?'#1a6ed8':'#fff',color:mLieu===l?'#fff':'#555',fontWeight:600,fontSize:12,cursor:'pointer'}}>{l}</button>)}
          </div>
          {!mAbsence&&<>
            <label style={lbl}>Horaires ⏱</label>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <select value={mDebut} onChange={e=>{setMDebut(e.target.value);if(!mFin||e.target.value>=mFin)setMFin('');}} style={selS}>
                <option value="">Début</option>{TIME_SLOTS.map(t=><option key={t} value={t}>{t}</option>)}
              </select>
              <span style={{color:'#aaa',fontWeight:700}}>→</span>
              <select value={mFin} onChange={e=>setMFin(e.target.value)} style={selS}>
                <option value="">Fin</option>{TIME_SLOTS.filter(t=>!mDebut||t>mDebut).map(t=><option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            {duree&&<div style={{background:'#f0f8ff',borderRadius:8,padding:'7px 10px',marginBottom:12,fontSize:12,color:'#1a6ed8',border:'1px solid #cce5ff'}}>⏱ {mDebut} → {mFin} = <strong>{duree}h</strong></div>}
          </>}
          <label style={lbl}>Absence / Congé</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:14}}>
            {ABSENCES.map(a=><button key={a} onClick={()=>{setMAbsence(a===mAbsence?'':a);if(a!==mAbsence){setMLieu('');setMDebut('');setMFin('');}}}
              style={{padding:'5px 11px',borderRadius:20,border:`1.5px solid ${mAbsence===a?'#d63384':'#e5e7eb'}`,background:mAbsence===a?'#d63384':'#fff',color:mAbsence===a?'#fff':'#555',fontWeight:600,fontSize:12,cursor:'pointer'}}>{a}</button>)}
          </div>
          <label style={lbl}>H. supplémentaires ⚡</label>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
            <input type="number" min={0} max={12} step={0.5} value={mHS} onChange={e=>setMHS(e.target.value)}
              style={{width:80,border:'1.5px solid #e5e7eb',borderRadius:9,padding:'8px 10px',fontSize:14,textAlign:'center',background:'#f8f9fa'}}/>
            <span style={{color:'#888',fontSize:12}}>heures supplémentaires</span>
          </div>
          {(mLieu||mAbsence||mDebut)&&<div style={{background:'#f8f9fa',borderRadius:8,padding:'7px 10px',marginBottom:14,fontSize:12,color:'#555',border:'1px solid #e5e7eb'}}>
            📋 <strong>{mAbsence||(mLieu&&mDebut&&mFin?`${mLieu} ${mDebut}/${mFin}`:mLieu||(mDebut&&mFin?`${mDebut}/${mFin}`:''))}</strong>
            {mHS>0&&<span style={{color:'#f57c00'}}> + ⚡{mHS}h</span>}
          </div>}
          <div style={{display:'flex',gap:8}}>
            <button onClick={saveModal} style={{flex:1,padding:'11px 0',borderRadius:9,border:'none',background:'#1a6ed8',color:'#fff',fontWeight:800,fontSize:14,cursor:'pointer'}}>✓ Enregistrer</button>
            <button onClick={clearModal} style={{padding:'11px 14px',borderRadius:9,border:'1px solid #f8d7da',background:'#fce8e8',color:'#d63384',fontWeight:700,fontSize:13,cursor:'pointer'}}>✕ Effacer</button>
            <button onClick={()=>setModal(null)} style={{padding:'11px 14px',borderRadius:9,border:'1px solid #ddd',background:'#f8f8f8',color:'#888',fontWeight:600,fontSize:13,cursor:'pointer'}}>Annuler</button>
          </div>
        </div>
      </div>
    );
  };

  // ── RENDER ──────────────────────────────────────────────────────────────────
  if(!sesLoaded) return null;
  if(!session) return <Login onLogin={s=>setSession(s)}/>;

  return (
    <div style={{minHeight:'100vh',background:'#f0f2f5',fontFamily:"'Segoe UI',Arial,sans-serif"}}>
      <div style={{background:'#fff',borderBottom:'1px solid #e5e7eb',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10,boxShadow:'0 1px 4px #0001'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:36,height:36,background:'linear-gradient(135deg,#1a6ed8,#8b1ad6)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>📅</div>
          <div>
            <div style={{fontSize:16,fontWeight:800,color:'#1a1a2e'}}>Planning Équipe</div>
            <div style={{fontSize:10,color:syncStatus.includes('✅')?'#1ab86b':syncStatus.includes('❌')?'#ef4444':'#f57c00',fontWeight:600}}>{syncStatus}</div>
          </div>
        </div>
        <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
          {navBtn("calendrier","🗓 Calendrier")}
          {navBtn("planning","📅 Planning")}
          {navBtn("conges","🏖️ Congés")}
          {navBtn("recap","📊 Compte rendu")}
          {isAdmin&&navBtn("equipe","👥 Équipe")}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:13,fontWeight:700}}>👤 {session.user}</div>
            <div style={{fontSize:10,color:isAdmin?'#8b1ad6':'#1a6ed8',fontWeight:600}}>{isAdmin?'✏️ Admin':'👁 Lecteur'}</div>
          </div>
          <button onClick={()=>{clearSession();setSession(null);}} style={{padding:'6px 12px',borderRadius:8,border:'1px solid #e5e7eb',background:'#f8f9fa',color:'#888',fontWeight:600,fontSize:12,cursor:'pointer'}}>Déconnexion</button>
        </div>
      </div>
      {!isAdmin&&<div style={{background:'#fff8e1',borderBottom:'1px solid #ffe082',padding:'7px 20px',fontSize:12,color:'#f57c00',fontWeight:600}}>
        👁 Mode consultation — Seule Laetitia peut modifier le planning.
      </div>}
      <div style={{padding:20,maxWidth:1400,margin:'0 auto'}}>
        {view==="calendrier"&&renderCalendrier()}
        {view==="planning"&&renderPlanning()}
        {view==="conges"&&renderConges()}
        {view==="recap"&&renderRecap()}
        {view==="equipe"&&renderEquipe()}
      </div>
      {isAdmin&&renderModal()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
