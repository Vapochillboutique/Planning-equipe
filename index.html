const pad   = n => String(n).padStart(2,'0');

const getMon = d => { var r=new Date(d); var day=r.getDay(); r.setDate(r.getDate()+(day===0?-6:1-day)); r.setHours(0,0,0,0); return r; };

const getWD = mon => Array.from({length:7},function(_,i){return addD(mon,i);});

const parseH = function(val, jourNum) {
  if(!val) return 0;
  var up = val.trim().toUpperCase();
  if(up==="OFF/FERIE"||up==="OFF/FÉRIÉ") return H_STD;
  var isAbs = ["OFF","CONGE","RTT","MALADIE","ABSENCE"].some(function(x){return up===x||up.startsWith(x+' ');});
  var isFT  = up.includes("FERIE TRAVAIL");
  if(isAbs && !isFT) return 0;
  var mt = val.match(/(\d{1,2})[hH](\d{2})\s*[\/\-]\s*(\d{1,2})[hH](\d{2})/i);
  if(!mt) return 0;
  var a = parseInt(mt[1])*60+parseInt(mt[2]);
  var b = parseInt(mt[3])*60+parseInt(mt[4]);
  var diff = b-a;
  if(diff<=0) return 0;
  var isCh   = up.includes("CHATEAU");
  var isBlere = up.includes("BLERE");
  var isSam  = jourNum===6;
  var pause  = 0;
  if(diff > 360) {
    if(isCh)     pause = isSam ? 60 : 90; // Château : 1h sam, 1h30 lun-ven
    else         pause = 60;              // Standard + Bléré : 1h
    // Bléré shifts courts (lun/jeu 5h, sam 4.5h) : diff <= 360 donc pas de pause
  }
  return Math.round((diff-pause)/60*10)/10;
};

const cellBg = function(val, ei) {
  if(!val) return '#fff';
  var up = val.trim().toUpperCase();
  if(up==="OFF") return '#f8f8f8';
  if(up.includes("FERIE TRAVAIL")) return '#fff0e0';
  if(up.includes("FERIE")) return '#fff8e1';
  if(up.includes("CONGE")) return '#e8f8f0';
  if(up==="RTT") return '#e8f0ff';
  if(up==="MALADIE") return '#fde8e8';
  if(up.includes("BLERE")||up.includes("BLÉRÉ")) return '#fce4ec';
  if(up.includes("BLERE")) return '#fce8ff';
  if(up.includes("TOURS")) return '#e8f8ee';
  if(up.includes("CHATEAU")) return '#fff8e1';
  if(up.includes("FORMATION")||up.includes("REUNION")) return '#e8f8f0';
  return eBg(ei);
};

const jouvres = function(d1, d2) {
  var d=new Date(d1), n=0;
  while(d<=d2){ if(d.getDay()!==0) n++; d.setDate(d.getDate()+1); }
  return n;
};

const getMonthWeeks = function(y,m) {
  var weeks=[], last=new Date(y,m+1,0), mon=getMon(new Date(y,m,1));
  while(mon<=last){
    var wd=getWD(mon).filter(function(d){return d.getMonth()===m&&!isWE(d);});
    if(wd.length) weeks.push({mon:new Date(mon),wd:wd});
    mon=addD(mon,7);
  }
  return weeks;
};

        else if(up==="OFF/FERIE"){fJ++;hT+=hJour;}
        else if(up!=="OFF"){
          hT+=h; if(cv.hsupp)hS+=Number(cv.hsupp);
          if(up.includes("CONGE"))cpJ++;
          else if(up==="RTT")rttJ++;
          else if(up==="MALADIE")malJ++;
        }
      }
      d.setDate(d.getDate()+1);
    }
    hT=Math.round(hT*10)/10; hFB=Math.round(hFB*10)/10; hFM=Math.round(hFM*10)/10;
    var nbSem=Math.round((jo/6)*10)/10;
    var hTheo=Math.round(nbSem*hSem*10)/10;
    var hTot=Math.round((hT+hS+hFM)*10)/10;
    var ecart=Math.round((hTot-hTheo)*10)/10;
    return {hT:hT,hS:hS,hFB:hFB,hFM:hFM,hTheo:hTheo,hTot:hTot,ecart:ecart,cpJ:cpJ,rttJ:rttJ,malJ:malJ,fJ:fJ,ftJ:ftJ,jo:jo,hSem:hSem};

                  React.createElement('span',{style:{color:eAcc(ei)}},'• '),emp.name),
                React.createElement('td',{style:{padding:'7px 8px',color:'#aaa',borderBottom:'1px solid #333',fontSize:12}},s.hT+'h'),
                React.createElement('td',{style:{padding:'7px 8px',color:s.hS>0?'#d97706':'#555',fontWeight:s.hS>0?700:400,borderBottom:'1px solid #333',fontSize:12}},s.hS>0?'+'+s.hS+'h':'--'),
                React.createElement('td',{style:{padding:'7px 8px',color:'#fff',fontWeight:800,borderBottom:'1px solid #333',fontSize:12}},s.hTot+'h'),
                React.createElement('td',{style:{padding:'7px 8px',borderBottom:'1px solid #333'}},
                  React.createElement('span',{style:{background:s.ecart>=0?'#059669':'#dc2626',color:'#fff',borderRadius:20,padding:'2px 7px',fontSize:10,fontWeight:700}},
                    s.ecart>0?'+'+s.ecart+'h':s.ecart<0?s.ecart+'h':'OK')),
                React.createElement('td',{style:{padding:'7px 8px',color:s.cpJ>0?'#34d399':'#555',borderBottom:'1px solid #333',fontSize:12}},s.cpJ>0?s.cpJ+'j':'--'),
                React.createElement('td',{style:{padding:'7px 8px',color:s.rttJ>0?'#818cf8':'#555',borderBottom:'1px solid #333',fontSize:12}},s.rttJ>0?s.rttJ+'j':'--'),
                React.createElement('td',{style:{padding:'7px 8px',color:s.malJ>0?'#f87171':'#555',borderBottom:'1px solid #333',fontSize:12}},s.malJ>0?s.malJ+'j':'--')
              );
            })
          )
        )
      )
    );
  };

  // ── EQUIPE ───────────────────────────────────────────────────────────────────
  var renderEquipe = function(){
    var addEmp=async function(){
      if(!newName.trim()) return;
      var l=[...employees,{id:'e'+Date.now(),name:newName.trim(),hSem:35}];
      setEmployees(l); await saveE(l); setNewName('');
    };
    return React.createElement('div',{style:{maxWidth:480}},
      React.createElement('h2',{style:{fontSize:20,fontWeight:800,color:'#1a1a2e',marginBottom:18}},'Equipe'),
      employees.map(function(emp,ei){
        return React.createElement('div',{key:emp.id,style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:'#fff',borderRadius:10,marginBottom:7,border:'1px solid #e5e7eb',borderLeft:'4px solid '+eAcc(ei)}},
          React.createElement('span',{style:{color:eAcc(ei)}},'•'),
          React.createElement('span',{style:{flex:1,fontWeight:700,fontSize:14}},emp.name),
          React.createElement('span',{style:{fontSize:11,color:'#aaa'}},emp.hSem+'h/sem'),
          React.createElement('button',{onClick:async function(){var l=employees.filter(function(e){return e.id!==emp.id;}); setEmployees(l); await saveE(l);},
            style:{background:'none',border:'none',color:'#ef4444',cursor:'pointer',fontSize:16}},'X')
        );
      }),
      React.createElement('div',{style:{background:'#fff',borderRadius:12,padding:18,marginTop:18,border:'1px solid #e5e7eb'}},
        React.createElement('div',{style:{fontSize:13,fontWeight:800,marginBottom:12}},'Ajouter un employe'),
        React.createElement('label',{style:lb},'Nom'),
        React.createElement('input',{value:newName,onChange:function(e){setNewName(e.target.value);},onKeyDown:function(e){if(e.key==='Enter')addEmp();},placeholder:'Prenom Nom',style:Object.assign({},ip,{marginBottom:12})}),
        React.createElement('button',{onClick:addEmp,style:{width:'100%',padding:'10px 0',borderRadius:8,border:'none',background:'#1a6ed8',color:'#fff',fontWeight:700,fontSize:14,cursor:'pointer'}},'+ Ajouter')
      )
    );
  };

  // ── MODAL
  var renderModal = function(){

    if(!modal) return null;
    var emp=employees.find(function(e){return e.id===modal.empId;}), ei=employees.findIndex(function(e){return e.id===modal.empId;});
    var toMin=function(t){var p=t.replace(/[hH]/,':').split(':');return parseInt(p[0])*60+(parseInt(p[1])||0);};
    var dureeRaw=mDeb&&mFin?toMin(mFin)-toMin(mDeb):0;
    var isCh=mLieu.toUpperCase().includes("CHATEAU")||mLieu.toUpperCase().includes("BLERE");
    var isSam=modal.date.getDay()===6;
    var pause=dureeRaw>360?(isCh?(isSam?60:90):60):0;
    var duree=mDeb&&mFin?Math.round((dureeRaw-pause)/60*10)/10:null;
    var slS={flex:1,border:'1.5px solid #e5e7eb',borderRadius:9,padding:'8px 7px',fontSize:13,color:'#1a1a2e',background:'#f8f9fa'};
    return React.createElement('div',{
      onClick:function(e){if(e.target===e.currentTarget)setModal(null);},
      style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.35)',display:'flex',alignItems:isMobile?'flex-end':'center',justifyContent:'center',zIndex:100,backdropFilter:'blur(3px)'}},
      React.createElement('div',{style:{background:'#fff',borderRadius:isMobile?'20px 20px 0 0':'16px',padding:isMobile?'20px 16px':26,width:isMobile?'100%':420,maxWidth:'100vw',boxShadow:'0 20px 60px rgba(0,0,0,0.2)',maxHeight:'90vh',overflowY:'auto'}},
        React.createElement('div',{style:{fontSize:15,fontWeight:800,marginBottom:2,color:eAcc(ei)}},'• '+(emp?emp.name:'')),
        React.createElement('div',{style:{fontSize:12,color:'#aaa',marginBottom:16}},JOURS[modal.dayIdx]+' '+frDC(modal.date)),
        React.createElement('div',{style:{fontSize:11,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.4px',marginBottom:6}},'Lieu de travail'),
        React.createElement('div',{style:{display:'flex',flexWrap:'wrap',gap:5,marginBottom:12}},
          LIEUX.map(function(l,li){
            return React.createElement('button',{key:l,onClick:function(){setMLieu(l===mLieu?'':l);setMAbs('');setMFerie(false);},
              style:{padding:'5px 10px',borderRadius:20,border:'1.5px solid '+(mLieu===l?'#1a6ed8':'#e5e7eb'),background:mLieu===l?'#1a6ed8':'#fff',color:mLieu===l?'#fff':'#555',fontWeight:600,fontSize:12,cursor:'pointer'}},
              LIEUX_DISPLAY[li]);
          })
        ),
        React.createElement('div',{style:{marginBottom:12}},
          React.createElement('button',{onClick:function(){setMFerie(function(f){var nf=!f;if(nf){setMAbs('');setMLieu('');}return nf;});},
            style:{padding:'6px 14px',borderRadius:20,border:'1.5px solid '+(mFerie?'#c2410c':'#e5e7eb'),background:mFerie?'#fff0e0':'#fff',color:mFerie?'#c2410c':'#555',fontWeight:700,fontSize:12,cursor:'pointer'}},
            'Ferie travaille'),
          mFerie&&React.createElement('span',{style:{marginLeft:8,fontSize:11,color:'#c2410c',fontWeight:600}},'heures x1.25')
        ),
        !mAbs&&React.createElement('div',null,
          React.createElement('div',{style:{fontSize:11,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.4px',marginBottom:6}},'Horaires'),
          React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:8}},
            React.createElement('select',{value:mDeb,onChange:function(e){setMDeb(e.target.value);if(!mFin||e.target.value>=mFin)setMFin('');},style:slS},
              React.createElement('option',{value:''},'Debut'),
              SLOTS.map(function(t){return React.createElement('option',{key:t,value:t},t);})
            ),
            React.createElement('span',{style:{color:'#aaa',fontWeight:700}},'-'),
            React.createElement('select',{value:mFin,onChange:function(e){setMFin(e.target.value);},style:slS},
              React.createElement('option',{value:''},'Fin'),
              SLOTS.filter(function(t){return !mDeb||t>mDeb;}).map(function(t){return React.createElement('option',{key:t,value:t},t);})
            )
          ),
          duree!==null&&duree>0&&React.createElement('div',{style:{background:'#eff6ff',borderRadius:8,padding:'6px 10px',marginBottom:12,fontSize:12,color:'#1a6ed8',border:'1px solid #bfdbfe'}},
            mDeb+' -> '+mFin+' = '+duree+'h (pause '+(isCh?(isSam?'1h':'1h30'):dureeRaw>360?'1h':'aucune')+')'+(mFerie?' => '+Math.round(duree*1.25*10)/10+'h':'')
          )
        ),
        React.createElement('div',{style:{fontSize:11,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.4px',marginBottom:6}},'Absence'),
        React.createElement('div',{style:{display:'flex',flexWrap:'wrap',gap:5,marginBottom:12}},
          ABSENCES.map(function(a,ai){
            return React.createElement('button',{key:a,onClick:function(){setMAbs(a===mAbs?'':a);if(a!==mAbs){setMLieu('');setMDeb('');setMFin('');setMFerie(false);}},
              style:{padding:'5px 10px',borderRadius:20,border:'1.5px solid '+(mAbs===a?'#dc2626':'#e5e7eb'),background:mAbs===a?'#dc2626':'#fff',color:mAbs===a?'#fff':'#555',fontWeight:600,fontSize:12,cursor:'pointer'}},
              ABSENCES_DISPLAY[ai]);
          })
        ),
        React.createElement('div',{style:{fontSize:11,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.4px',marginBottom:6}},'H. supplementaires'),
        React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:18}},
          React.createElement('input',{type:'number',min:0,max:12,step:0.5,value:mHS,onChange:function(e){setMHS(e.target.value);},
            style:{width:75,border:'1.5px solid #e5e7eb',borderRadius:8,padding:'8px 10px',fontSize:14,textAlign:'center',background:'#f8f9fa'}}),
          React.createElement('span',{style:{color:'#888',fontSize:12}},'h supp. ce jour')
        ),
        React.createElement('div',{style:{display:'flex',gap:7}},
          React.createElement('button',{onClick:saveModal,style:{flex:1,padding:'11px 0',borderRadius:9,border:'none',background:'#1a6ed8',color:'#fff',fontWeight:800,fontSize:14,cursor:'pointer'}},'Enregistrer'),
          React.createElement('button',{onClick:clearModal,style:{padding:'11px 12px',borderRadius:9,border:'1px solid #fca5a5',background:'#fde8e8',color:'#dc2626',fontWeight:700,fontSize:13,cursor:'pointer'}},'Effacer'),
          React.createElement('button',{onClick:function(){setModal(null);},style:{padding:'11px 12px',borderRadius:9,border:'1px solid #e5e7eb',background:'#f8f9fa',color:'#888',fontWeight:600,fontSize:13,cursor:'pointer'}},'Annuler')
        )
      )
    );
  };

  // ── RENDER ───────────────────────────────────────────────────────────────────
  if(!sesOk) return null;
  if(!session) return React.createElement(Login,{onLogin:function(s){setSession(s);}});

  return React.createElement('div',{style:{minHeight:'100vh',background:'#f5f6f8',fontFamily:"'Segoe UI',Arial,sans-serif"}},
    React.createElement('div',{style:{background:'#fff',borderBottom:'1px solid #e5e7eb',padding:isMobile?'8px 12px':'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,boxShadow:'0 1px 3px rgba(0,0,0,0.05)',position:'sticky',top:0,zIndex:10}},
      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8}},
        React.createElement('div',{style:{width:32,height:32,background:'linear-gradient(135deg,#1a6ed8,#8b1ad6)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}},'\u{1F4C5}'),
        !isMobile&&React.createElement('div',null,
          React.createElement('div',{style:{fontSize:14,fontWeight:800,color:'#1a1a2e',lineHeight:1}},'Planning Equipe'),
          React.createElement('div',{style:{fontSize:9,color:sync.includes('Synchro')?'#059669':sync.includes('Err')?'#dc2626':'#d97706',fontWeight:600}},sync)
        ),
        isMobile&&React.createElement('div',{style:{fontSize:9,fontWeight:700,color:sync.includes('Synchro')?'#059669':'#d97706'}},sync)
      ),
      React.createElement('div',{style:{display:'flex',gap:4,flexWrap:'nowrap',overflowX:'auto'}},
        nb('planning','Planning'),
        nb('conges','Conges'),
        nb('recap',isMobile?'Recap':'Compte rendu'),
        isAdmin&&nb('equipe','Equipe')
      ),
      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:6}},
        !isMobile&&React.createElement('div',{style:{textAlign:'right',lineHeight:1.3}},
          React.createElement('div',{style:{fontSize:12,fontWeight:700,color:'#1a1a2e'}},session.user),
          React.createElement('div',{style:{fontSize:10,color:isAdmin?'#8b1ad6':'#1a6ed8',fontWeight:600}},isAdmin?'Admin':'Lecteur')
        ),
        React.createElement('button',{onClick:function(){clearS();setSession(null);},style:{padding:'6px 10px',borderRadius:7,border:'1px solid #e5e7eb',background:'#f8f9fa',color:'#888',fontWeight:600,fontSize:11,cursor:'pointer'}},isMobile?'Deco':'Deconnexion')
      )
    ),
    !isAdmin&&React.createElement('div',{style:{background:'#fffbeb',borderBottom:'1px solid #fde68a',padding:'6px 16px',fontSize:11,color:'#d97706',fontWeight:600}},
      'Mode consultation - Seule Laetitia peut modifier le planning.'),
    React.createElement('div',{style:{padding:isMobile?'10px':'16px',maxWidth:1400,margin:'0 auto'}},
      view==='planning'&&renderPlanning(),
      view==='conges'&&renderConges(),
      view==='recap'&&renderRecap(),
      view==='equipe'&&renderEquipe()
    ),
    isAdmin&&renderModal()
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
